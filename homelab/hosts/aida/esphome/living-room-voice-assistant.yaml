touchscreen:
  - platform: cst816
    id: touch
    display: lcd
    i2c_id: i2c_bus
    interrupt_pin: GPIO4
    reset_pin:
      pca9554: io_expander
      number: 0
    on_update:
      - lambda: |-
          if (!touches.empty())
            id(touch_dy) = (int) touches[0].y - (int) touches[0].y_org;
    # A short vertical travel is a tap (Assist); a longer one is a swipe
    # (volume: up is louder).
    on_release:
      - lambda: |-
          const int dy = id(touch_dy);
          id(touch_dy) = 0;
          if (dy <= -50) id(change_volume)->execute(0.1f);
          else if (dy >= 50) id(change_volume)->execute(-0.1f);
          else id(toggle_assist)->execute();

light:
  - platform: monochromatic
    id: backlight
    name: Display Backlight
    icon: mdi:brightness-6
    output: backlight_output
    restore_mode: RESTORE_DEFAULT_ON
    default_transition_length: 250ms

lvgl:
  displays: [lcd]
  touchscreens: [touch]
  buffer_size: 50%
  color_depth: 16
  log_level: WARN
  pages:
    - id: main_page
      bg_color: 0x000000
      widgets:
        - arc:
            id: ring
            align: CENTER
            width: 352
            height: 352
            adjustable: false
            clickable: false
            rotation: 270
            start_angle: 0
            end_angle: 360
            min_value: 0
            max_value: 100
            value: 100
            arc_width: 10
            arc_color: 0x101010
            indicator:
              arc_width: 10
              arc_color: 0x303030
            knob:
              bg_opa: TRANSP
              pad_all: 0
        - label:
            id: status_label
            align: CENTER
            y: -95
            text: ""
            text_font: montserrat_24
            text_color: 0xB0B0B0
        - label:
            id: clock_label
            align: CENTER
            y: -30
            text: ""
            text_font: montserrat_48
            text_color: 0xFFFFFF
        - label:
            id: date_label
            align: CENTER
            y: 25
            text: ""
            text_font: montserrat_20
            text_color: 0x9E9E9E
        - label:
            id: session_label
            align: TOP_MID
            y: 175
            width: 270
            long_mode: WRAP
            text_align: CENTER
            text: ""
            text_font: montserrat_20
            text_color: 0xFFFFFF
            hidden: true
        - label:
            id: timer_label
            align: CENTER
            y: 85
            text: ""
            text_font: montserrat_28
            text_color: 0xFFA000
            hidden: true
