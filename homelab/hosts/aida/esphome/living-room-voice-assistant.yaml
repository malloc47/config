# Living-room voice assistant: a Waveshare ESP32-S3-Touch-LCD-1.85C-BOX V2
# (Rev2.0 silkscreen; 360x360 round ST77916 LCD, CST816 touch, ES8311 DAC +
# NS4150B amp, ES7210 ADC with two analog mics, 16 MB flash, 8 MB PSRAM) as a
# Home Assistant Assist satellite, toward replacing the Google Home Minis.
#
# Audio runs through n-IA-hane/esphome-audio-stack (local external components,
# see esphomeComponents in modules/home-automation.nix). The board has one I2S
# bus shared by the DAC and ADC, so stock i2s_audio can't capture while it
# plays; esp_audio_stack owns the bus full duplex, and the ES7210's MIC3 input
# carries an attenuated copy of the DAC output (TDM slot 1) as the echo
# reference for esp-sr's AEC (esp_aec). Both mics are averaged into one AEC
# input; the cleaned 16 kHz stream feeds micro_wake_word and voice_assistant,
# so the wake word works while music or a reply is playing (barge-in). The
# codec/reference calibration (gains, slots, PA gain) is copied from the
# esphome-intercom profile for this board
# (packages/audio/profiles/waveshare-s3-box-v2-common.yaml).
#
# Playback: one speaker_source media player with an announcement pipeline
# (TTS, local sounds) and a media pipeline, each resampled to 48 kHz and mixed
# into the hardware speaker; announcements and Assist sessions duck media by
# 20 dB. The amp (GPIO15) powers down 30 s after playback goes idle.
#
# Wake words (choose in HA's satellite settings): "Hey Jeeves" (the
# house-wide one), or "Okay Nabu". While a timer rings or a reply plays,
# "Stop" ends it. The BOOT button or a tap on the screen starts/stops Assist
# (and silences a timer); swiping up/down on the screen changes the volume
# (the board has no other usable buttons). "Wake word sensitivity" in HA
# trades missed wakes against false ones.
#
# Display (LVGL): a ring around the edge shows the phase (blue listening,
# purple thinking, green replying, red error/muted; a timer's remaining
# fraction in amber), the clock and date when idle, and what was heard / the
# reply during a session.
#
# First flash is over USB (it has no network yet); see docs/esphome.md.
substitutions:
  name: living-room-voice-assistant
  friendly_name: Living Room Voice Assistant
  api_key: !secret living_room_voice_assistant_api_key
  ota_password: !secret living_room_voice_assistant_ota_password
  ap_password: !secret living_room_voice_assistant_ap_password

  # Voice assistant phases (as in the HA Voice PE firmware), drive the display.
  phase_idle: "1"
  phase_waiting: "2"
  phase_listening: "3"
  phase_thinking: "4"
  phase_replying: "5"
  phase_not_ready: "10"
  phase_error: "11"

  # Local sounds from the HA Voice PE firmware, pinned by commit.
  sounds: https://github.com/esphome/home-assistant-voice-pe/raw/d4e6fa43d6a1a7d342b7d4d403567e06516719de/sounds

packages:
  base: !include common/base.yaml

external_components:
  - source:
      type: local
      path: components
    components: [esp_audio_stack, esp_aec, esp_audio_capture]

esphome:
  min_version: 2026.10.0
  on_boot:
    - priority: 600
      then:
        - light.turn_on:
            id: backlight
            brightness: 80%
        - script.execute: draw_display
    # If HA never connects, stop showing "connecting" after a while.
    - priority: -100
      then:
        - delay: 30s
        - lambda: id(init_in_progress) = false;

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  flash_mode: qio
  framework:
    type: esp-idf
    advanced:
      compiler_optimization: PERF
    # From esphome-intercom's ESP32-S3 platform base and board file: esp-sr
    # needs the 64 KB / 64 B data cache, and large allocations (esp-sr,
    # codec-dev, LVGL buffers) go to PSRAM, keeping internal RAM for DMA,
    # I2S and Wi-Fi.
    sdkconfig_options:
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_ESP_WIFI_TASK_PINNED_TO_CORE_1: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"
      CONFIG_SPIRAM_RODATA: "n"
      CONFIG_SPIRAM_USE_CAPS_ALLOC: "n"
      CONFIG_SPIRAM_USE_MALLOC: "y"
      CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL: "4096"
      CONFIG_SPIRAM_MALLOC_RESERVE_INTERNAL: "65536"
      CONFIG_SPIRAM_TRY_ALLOCATE_WIFI_LWIP: "y"
      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_DYNAMIC_FREE_CONFIG_DATA: "y"
      CONFIG_MBEDTLS_DYNAMIC_FREE_CA_CERT: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG

# Wi-Fi power save adds latency to every audio frame; this is mains powered.
# Plugged into aida's USB 3 port (for the first flash) it could not join at
# all (association/auth expired, 4-way handshake timeouts at -35 dB RSSI) —
# 2.4 GHz noise from the port; it joins fine on a charger a few feet away.
# Reduced TX power is plenty at that range.
wifi:
  power_save_mode: none
  output_power: 8.5dB
  ap:
    # base.yaml's "<friendly_name> Fallback Hotspot" exceeds 32 characters.
    ssid: Living Room VA Fallback

network:
  enable_high_performance: true

i2c:
  - id: i2c_bus
    sda: GPIO11
    scl: GPIO10
    scan: false

# TCA9554 (register-compatible): LCD reset on pin 1, touch reset on pin 0.
pca9554:
  - id: io_expander
    address: 0x20

globals:
  - id: init_in_progress
    type: bool
    restore_value: false
    initial_value: "true"
  - id: phase
    type: int
    restore_value: false
    initial_value: ${phase_not_ready}
  # What Assist heard, then its reply; shown during a session.
  - id: session_text
    type: std::string
    restore_value: false
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: false
  - id: timer_active
    type: bool
    restore_value: false
    initial_value: "false"
  # Vertical travel of the current touch (px, + = down), for tap vs swipe.
  - id: touch_dy
    type: int
    restore_value: false
    initial_value: "0"
  # Set while the mics run at the lower playback PGA.
  - id: playback_pga_active
    type: bool
    restore_value: false
    initial_value: "false"
  # While set, the ring shows the volume instead of the phase.
  - id: show_volume
    type: bool
    restore_value: false
    initial_value: "false"

# --- Audio -------------------------------------------------------------------

esp_audio_stack:
  id: audio_bus
  i2s_lrclk_pin: GPIO38
  i2s_bclk_pin: GPIO48
  i2s_mclk_pin: GPIO2
  i2s_din_pin: GPIO39
  i2s_dout_pin: GPIO47
  # The bus (and speaker) run at 48 kHz; the mic path is converted to 16 kHz
  # for AEC, wake word and STT.
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: aec_processor
  audio_task_stack_in_psram: true
  buffers_in_psram: true
  task_core: 1
  task_priority: 19
  task_stack_size: 8192
  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed
  codec:
    i2c_id: i2c_bus
    input:
      type: es7210
      address: 0x40
      mic_selected: 15
      # Overridden at runtime by the Mic PGA numbers below: high while
      # listening, low during playback.
      gain_db: 0.0
      # Physical MIC3 carries the attenuated DAC output (TDM slot 1).
      ref_channel: 2
      ref_gain_db: 24.0
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
      # NS4150B gain: Av = 240k/Rin with R49/R53 = 100k, 20*log10(2.4).
      pa_gain: 7.6
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: [0, 2]
  tdm_ref_slot: 1
  mic_mix: average
  on_amplifier_required:
    - script.stop: amp_idle_powerdown
    - output.turn_on: speaker_enable
    - script.execute: pga_for_playback
  on_amplifier_idle:
    - script.execute: amp_idle_powerdown
    - script.stop: pga_for_playback
    - lambda: id(playback_pga_active) = false;
    - number.set:
        id: mic_pga
        value: !lambda return id(mic_pga_listening).state;

esp_aec:
  id: aec_processor
  sample_rate: 16000
  filter_length: 4
  mode: sr_high_perf

microphone:
  - platform: esp_audio_stack
    id: mic

speaker:
  - platform: esp_audio_stack
    id: hw_speaker
    sample_rate: 48000
    bits_per_sample: 16
    timeout: 1s

  - platform: mixer
    id: audio_mixer
    output_speaker: hw_speaker
    num_channels: 1
    bits_per_sample: 16
    task_stack_in_psram: true
    source_speakers:
      - id: announcement_mixer_input
        timeout: 10s
        buffer_duration: 100ms
        sample_rate: 48000
        bits_per_sample: 16
        num_channels: 1
      - id: media_mixer_input
        timeout: 10s
        buffer_duration: 100ms
        sample_rate: 48000
        bits_per_sample: 16
        num_channels: 1

  # Each pipeline is resampled to the bus rate before the mixer (Piper TTS is
  # 22.05 kHz, music varies).
  - platform: resampler
    id: announcement_speaker
    output_speaker: announcement_mixer_input
    task_stack_in_psram: true
    sample_rate: 48000
    bits_per_sample: 16
    num_channels: 1
  - platform: resampler
    id: media_speaker
    output_speaker: media_mixer_input
    task_stack_in_psram: true
    sample_rate: 48000
    bits_per_sample: 16
    num_channels: 1

output:
  - platform: gpio
    id: speaker_enable
    pin: GPIO15
  - platform: ledc
    id: backlight_output
    pin: GPIO5

audio:
  codecs:
    flac:
      buffer_memory: psram

audio_file:
  - id: wake_sound_file
    file: ${sounds}/wake_word_triggered.flac
  - id: volume_tick_file
    file: ${sounds}/center_button_press.flac
  - id: timer_finished_sound_file
    file: ${sounds}/timer_finished.flac
  - id: mute_on_sound_file
    file: ${sounds}/mute_switch_on.flac
  - id: mute_off_sound_file
    file: ${sounds}/mute_switch_off.flac

media_source:
  - platform: audio_file
    id: file_announcement_source
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
    task_stack_in_psram: true
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000
    task_stack_in_psram: true

media_player:
  - platform: speaker_source
    id: player
    name: Media Player
    announcement_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      speaker: announcement_speaker
      sources:
        - file_announcement_source
        - http_announcement_source
    media_pipeline:
      format: FLAC
      num_channels: 1
      sample_rate: 48000
      speaker: media_speaker
      sources:
        - http_media_source
    volume_initial: 50%
    volume_increment: 5%
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 20
          duration: 0s
    on_state:
      - if:
          condition:
            and:
              - switch.is_off: timer_ringing
              - not:
                  voice_assistant.is_running:
              - not:
                  media_player.is_announcing: player
          then:
            - mixer_speaker.apply_ducking:
                id: media_mixer_input
                decibel_reduction: 0
                duration: 1s

# --- Voice -------------------------------------------------------------------

micro_wake_word:
  id: mww
  microphone: mic
  stop_after_detection: false
  models:
    # "Hey Jeeves", the house-wide wake word (the Kiosk Satellite tablets load
    # the same model as a custom microWakeWord model): Tater Totterson's
    # community model (MIT; V6, published recall 99.2% at 0 false accepts/h
    # on its synthetic validation set), pinned by commit.
    - model: https://raw.githubusercontent.com/TaterTotterson/Tater-Wake-Words/71b40f3e2d97e85cf59749f0df1a69a535ab0451/microWakeWordsV6/hey_jeeves.esphome.json
      id: hey_jeeves
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    - model: https://github.com/kahrendt/microWakeWord/releases/download/stop/stop.json
      id: stop
      internal: true
  vad:
  on_wake_word_detected:
    - if:
        condition:
          switch.is_off: mic_mute
        then:
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      - voice_assistant.stop:
                    else:
                      - if:
                          condition:
                            media_player.is_announcing: player
                          then:
                            - media_player.stop:
                                id: player
                                announcement: true
                          else:
                            - script.execute: start_assist
                            - script.wait: start_assist
                            # Pass the detected word on to HA's pipeline.
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

# Probability cutoffs per model, as uint8 (x/255). "Hey jeeves" ships at
# 0.95 and its trainer's close-miss threshold is 0.78; the "Okay Nabu"
# values are the HA Voice PE's.
select:
  - platform: template
    name: Wake word sensitivity
    id: wake_word_sensitivity
    icon: mdi:ear-hearing
    optimistic: true
    restore_value: true
    entity_category: config
    initial_option: Moderately sensitive
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      - lambda: |-
          if (x == "Slightly sensitive") {
            id(hey_jeeves).set_probability_cutoff(242);  // 0.95
            id(okay_nabu).set_probability_cutoff(217);   // 0.85
          } else if (x == "Moderately sensitive") {
            id(hey_jeeves).set_probability_cutoff(224);  // 0.88
            id(okay_nabu).set_probability_cutoff(176);   // 0.69
          } else {
            id(hey_jeeves).set_probability_cutoff(204);  // 0.80
            id(okay_nabu).set_probability_cutoff(143);   // 0.56
          }

voice_assistant:
  id: va
  microphone: mic
  media_player: player
  micro_wake_word: mww
  use_wake_word: false
  # AEC already cleaned the stream; ESPHome's own NS/AGC would fight it.
  noise_suppression_level: 0
  auto_gain: 0dBFS
  volume_multiplier: 1.0
  on_client_connected:
    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    - script.execute: boost_mww_priority
    - lambda: id(phase) = ${phase_idle};
    - script.execute: draw_display
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(phase) = ${phase_not_ready};
    - script.execute: draw_display
  on_error:
    - logger.log:
        level: WARN
        format: "Assist error %s: %s"
        args: [code.c_str(), message.c_str()]
    - if:
        condition:
          lambda: |-
            return !id(init_in_progress) && code != "duplicate_wake_up_detected" &&
                   code != "stt-no-text-recognized";
        then:
          - lambda: |-
              id(phase) = ${phase_error};
              id(session_text) = message;
          - script.execute: draw_display
          # on_end doesn't follow every error (or announcements), so clear
          # the error on its own.
          - script.execute: clear_error
  on_start:
    - mixer_speaker.apply_ducking:
        id: media_mixer_input
        decibel_reduction: 20
        duration: 0s
    - lambda: id(session_text) = "";
  on_listening:
    - lambda: id(phase) = ${phase_waiting};
    - script.execute: draw_display
  on_stt_vad_start:
    - lambda: id(phase) = ${phase_listening};
    - script.execute: draw_display
  on_stt_vad_end:
    - lambda: id(phase) = ${phase_thinking};
    - script.execute: draw_display
  on_stt_end:
    - lambda: id(session_text) = x;
    - script.execute: draw_display
  on_intent_progress:
    - if:
        condition:
          # A non-empty x means a streaming TTS URL went to the media player.
          lambda: return !x.empty();
        then:
          - lambda: id(phase) = ${phase_replying};
          - script.execute: draw_display
          - script.execute: enable_stop_word_during_reply
  on_tts_start:
    - lambda: id(session_text) = x;
    - if:
        condition:
          lambda: return id(phase) != ${phase_replying};
        then:
          - lambda: id(phase) = ${phase_replying};
          - script.execute: enable_stop_word_during_reply
    - script.execute: draw_display
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    - mixer_speaker.apply_ducking:
        id: media_mixer_input
        decibel_reduction: 0
        duration: 1s
    # Leave an error, or the reply text, up for a moment.
    - delay: 2s
    - if:
        condition:
          not:
            voice_assistant.is_running:
        then:
          - lambda: |-
              id(phase) = ${phase_idle};
              id(session_text) = "";
          - script.execute: draw_display
  on_timer_started:
    - script.execute: update_timers
  on_timer_updated:
    - script.execute: update_timers
  on_timer_cancelled:
    - script.execute: update_timers
  on_timer_tick:
    - script.execute: update_timers
  on_timer_finished:
    - switch.turn_on: timer_ringing

# --- Controls ----------------------------------------------------------------

switch:
  - platform: template
    id: mic_mute
    name: Mute Microphone
    icon: mdi:microphone-off
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    entity_category: config
    on_turn_on:
      - microphone.mute: mic
      - voice_assistant.stop:
      - script.execute:
          id: play_sound
          priority: false
          sound: mute_on_sound_file
      - script.execute: draw_display
    on_turn_off:
      - microphone.unmute: mic
      - script.execute:
          id: play_sound
          priority: false
          sound: mute_off_sound_file
      - script.execute: draw_display
  - platform: template
    id: wake_sound
    name: Wake Sound
    icon: mdi:bullhorn
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    entity_category: config
  # On while a finished timer rings; any wake word, "stop", BOOT or a tap
  # ends it, and it gives up after 15 minutes.
  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 20
          duration: 0s
      - micro_wake_word.enable_model: stop
      - media_player.repeat_one:
          id: player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: player
          pipeline: announcement
          delay: 500ms
      - script.execute:
          id: play_sound
          priority: true
          sound: timer_finished_sound_file
      - script.execute: draw_display
      - delay: 15min
      - switch.turn_off: timer_ringing
    on_turn_off:
      - micro_wake_word.disable_model: stop
      - media_player.repeat_off:
          id: player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: player
          pipeline: announcement
          delay: 0ms
      - if:
          condition:
            media_player.is_announcing: player
          then:
            - media_player.stop:
                id: player
                announcement: true
      - mixer_speaker.apply_ducking:
          id: media_mixer_input
          decibel_reduction: 0
          duration: 1s
      - script.execute: draw_display
  - platform: esp_audio_stack
    aec:
      id: aec_switch
      name: Echo Cancellation
      icon: mdi:ear-hearing
      restore_mode: RESTORE_DEFAULT_ON

number:
  - platform: esp_audio_stack
    # Digital gain after AEC; it can't recover what the ADC didn't resolve.
    mic_gain:
      id: mic_gain
      name: Mic Gain
      min_value: -20
      max_value: 30
      initial_value: 24
    # Analog ES7210 gain (0-37.5 dB) for the two mics, driven by the two
    # template numbers below, and for the DAC reference channel.
    input_pga:
      id: mic_pga
      name: Microphone PGA
      internal: true
    reference_pga:
      name: Reference PGA

  # Analog mic gain switches with playback. Measured 2026-11-08 at 5 ft: at
  # 0 dB speech reached the ADC at -78 dBFS (peaks -62), too few bits for the
  # wake word; 30 dB brings it to -51 dBFS. But at 30 dB the speaker (50%
  # volume) clips the mics and AEC then removes only ~1 dB of echo, so
  # playback longer than the wake chime drops to the lower gain.
  - platform: template
    id: mic_pga_listening
    name: Mic PGA (listening)
    icon: mdi:microphone-plus
    entity_category: config
    unit_of_measurement: dB
    min_value: 0
    max_value: 37.5
    step: 1.5
    initial_value: 30
    restore_value: true
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: return !id(playback_pga_active);
          then:
            - number.set:
                id: mic_pga
                value: !lambda return x;
  - platform: template
    id: mic_pga_playback
    name: Mic PGA (during playback)
    icon: mdi:microphone-minus
    entity_category: config
    unit_of_measurement: dB
    min_value: 0
    max_value: 37.5
    step: 1.5
    initial_value: 12
    restore_value: true
    optimistic: true
    on_value:
      - if:
          condition:
            lambda: return id(playback_pga_active);
          then:
            - number.set:
                id: mic_pga
                value: !lambda return x;

binary_sensor:
  - platform: gpio
    id: boot_button
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
    internal: true
    on_click:
      - script.execute: toggle_assist

sensor:
  - platform: adc
    id: battery_voltage
    name: Battery Voltage
    pin: GPIO8
    attenuation: 12db
    accuracy_decimals: 2
    update_interval: 10s
    entity_category: diagnostic
    filters:
      - multiply: 3.0
      - median:
          window_size: 7
          send_every: 7
          send_first_at: 1
      - throttle: 1min

button:
  - platform: restart
    name: Restart
    entity_category: config
  - platform: template
    name: Start audio capture
    entity_category: diagnostic
    on_press:
      - esp_audio_capture.start: audio_capture
  - platform: template
    name: Stop audio capture
    entity_category: diagnostic
    on_press:
      - esp_audio_capture.stop: audio_capture

# Diagnostics: streams 15 s of PCM from each stage (both raw mics, the echo
# reference, AEC in/out, final output) over TCP to a receiver on aida, for
# level and gain tuning. Nothing runs until Start is pressed. Receiver:
# esphome-audio-stack's tools/capture_audio.py, port 19091 (closed in aida's
# firewall unless opened for the capture).
esp_audio_capture:
  id: audio_capture
  esp_audio_stack_id: audio_bus
  microphone_id: mic
  address: 192.168.1.10
  duration: 15s
  buffer_size: 65536
  points: [raw_mic, reference, processor_input, processor_output, output]

script:
  # Start a push-to-talk session (BOOT/tap); a wake word passes its own word.
  - id: start_assist
    then:
      - if:
          condition:
            switch.is_on: wake_sound
          then:
            - script.execute:
                id: play_sound
                priority: true
                sound: wake_sound_file
            - delay: 300ms

  - id: toggle_assist
    then:
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing
          else:
            - if:
                condition:
                  voice_assistant.is_running:
                then:
                  - voice_assistant.stop:
                else:
                  - if:
                      condition:
                        media_player.is_announcing: player
                      then:
                        - media_player.stop:
                            id: player
                            announcement: true
                      else:
                        - if:
                            condition:
                              switch.is_off: mic_mute
                            then:
                              - script.execute: start_assist
                              - script.wait: start_assist
                              - voice_assistant.start:

  - id: play_sound
    parameters:
      priority: bool
      sound: string
    then:
      - if:
          condition:
            lambda: return priority;
          then:
            - media_player.stop:
                id: player
                announcement: true
      - lambda: |-
          if (id(player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING || priority) {
            id(player)->make_call().set_media_url("audio-file://" + sound).set_announcement(true).perform();
          }

  # "Stop" ends a reply longer than a second (enabled only then, to avoid
  # false triggers).
  - id: enable_stop_word_during_reply
    then:
      - wait_until:
          condition:
            media_player.is_announcing: player
          timeout: 5s
      - delay: 1s
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing: player
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

  # Wake-word inference shares the CPU with AEC and LVGL; keep it ahead of
  # UI and media work (as esphome-intercom does).
  - id: boost_mww_priority
    then:
      - wait_until:
          condition:
            lambda: return xTaskGetHandle("mww") != nullptr;
          timeout: 2s
      - lambda: |-
          TaskHandle_t t = xTaskGetHandle("mww");
          if (t != nullptr) vTaskPrioritySet(t, 8);

  - id: change_volume
    parameters:
      delta: float
    then:
      - media_player.volume_set:
          id: player
          volume: !lambda return clamp(id(player).volume + delta, 0.0f, 1.0f);
      - script.execute: volume_overlay
      - script.execute:
          id: play_sound
          priority: false
          sound: volume_tick_file

  # Show the volume on the ring for a moment after it changes.
  - id: volume_overlay
    mode: restart
    then:
      - lambda: id(show_volume) = true;
      - script.execute: draw_display
      - delay: 2s
      - lambda: id(show_volume) = false;
      - script.execute: draw_display

  - id: clear_error
    mode: restart
    then:
      - delay: 3s
      - if:
          condition:
            and:
              - lambda: return id(phase) == ${phase_error};
              - not:
                  voice_assistant.is_running:
          then:
            - lambda: |-
                id(phase) = ${phase_idle};
                id(session_text) = "";
            - script.execute: draw_display

  # Lower the analog mic gain once playback has run past the wake chime
  # (so a command spoken right after the chime keeps the listening gain);
  # on_amplifier_idle restores it.
  - id: pga_for_playback
    mode: restart
    then:
      - delay: 700ms
      - if:
          condition:
            lambda: return id(phase) != ${phase_waiting} && id(phase) != ${phase_listening};
          then:
            - lambda: id(playback_pga_active) = true;
            - number.set:
                id: mic_pga
                value: !lambda return id(mic_pga_playback).state;

  - id: amp_idle_powerdown
    mode: restart
    then:
      - delay: 30s
      - output.turn_off: speaker_enable

  - id: update_timers
    then:
      - lambda: |-
          const auto &timers = id(va).get_timers();
          bool active = false;
          voice_assistant::Timer first{};
          for (const auto &t : timers) {
            if (t.is_active && (!active || t.seconds_left < first.seconds_left)) {
              first = t;
              active = true;
            }
          }
          id(timer_active) = active;
          if (active) id(first_active_timer) = first;
      - script.execute: draw_display

  # Redraw everything from the current state (cheap; LVGL only flushes what
  # changed).
  - id: draw_display
    then:
      - lambda: |-
          const int p = id(phase);
          const bool ringing = id(timer_ringing).state;
          const bool muted = id(mic_mute).state;
          const bool idle = p == ${phase_idle} && !ringing;

          // Ring colour and fill.
          uint32_t color = 0x303030;
          int value = 100;
          if (ringing) color = 0xFFA000;
          else if (p == ${phase_error} || (muted && idle)) color = 0xE53935;
          else if (p == ${phase_waiting} || p == ${phase_listening}) color = 0x2196F3;
          else if (p == ${phase_thinking}) color = 0x9C27B0;
          else if (p == ${phase_replying}) color = 0x43A047;
          else if (p == ${phase_not_ready}) color = 0x606060;
          else if (id(timer_active)) {
            const auto &t = id(first_active_timer);
            color = 0xFFA000;
            value = t.total_seconds ? (100 * t.seconds_left) / t.total_seconds : 0;
          }
          if (id(show_volume)) {
            color = 0xFFFFFF;
            value = (int) roundf(id(player).volume * 100);
          }
          lv_obj_set_style_arc_color(id(ring), lv_color_hex(color), LV_PART_INDICATOR);
          lv_arc_set_value(id(ring), value);

          // Status line.
          const char *status = "";
          if (ringing) status = "Timer done";
          else if (p == ${phase_not_ready}) status = id(init_in_progress) ? "Connecting..." : "Not connected";
          else if (p == ${phase_waiting}) status = "Listening...";
          else if (p == ${phase_listening}) status = "Listening...";
          else if (p == ${phase_thinking}) status = "Thinking...";
          else if (p == ${phase_error}) status = "Error";
          else if (muted) status = "Mic muted";
          char volume_text[16];
          if (id(show_volume)) {
            snprintf(volume_text, sizeof(volume_text), "Volume %d%%", (int) roundf(id(player).volume * 100));
            status = volume_text;
          }
          lv_label_set_text(id(status_label), status);

          // Session text replaces the date while Assist is active.
          if (idle || id(session_text).empty()) {
            lv_obj_add_flag(id(session_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_remove_flag(id(date_label), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_label_set_text(id(session_label), id(session_text).c_str());
            lv_obj_remove_flag(id(session_label), LV_OBJ_FLAG_HIDDEN);
            lv_obj_add_flag(id(date_label), LV_OBJ_FLAG_HIDDEN);
          }

          // Timer countdown under the clock.
          if (id(timer_active) && !ringing) {
            const unsigned s = id(first_active_timer).seconds_left;
            char buf[16];
            if (s >= 3600) snprintf(buf, sizeof(buf), "%u:%02u:%02u", s / 3600, (s / 60) % 60, s % 60);
            else snprintf(buf, sizeof(buf), "%u:%02u", s / 60, s % 60);
            lv_label_set_text(id(timer_label), buf);
            lv_obj_remove_flag(id(timer_label), LV_OBJ_FLAG_HIDDEN);
          } else {
            lv_obj_add_flag(id(timer_label), LV_OBJ_FLAG_HIDDEN);
          }
      - script.execute: draw_clock

  - id: draw_clock
    then:
      - lambda: |-
          auto now = id(ha_time).now();
          if (!now.is_valid()) return;
          // newlib's strftime has no %-I / %-d (ESPHome then returns
          // "ERROR"), so drop the leading zeros by hand.
          const int hour = now.hour % 12 == 0 ? 12 : now.hour % 12;
          char clock[8];
          snprintf(clock, sizeof(clock), "%d:%02d", hour, now.minute);
          lv_label_set_text(id(clock_label), clock);
          const std::string date = now.strftime("%A, %B ") + std::to_string(now.day_of_month);
          lv_label_set_text(id(date_label), date.c_str());

time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - script.execute: draw_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: draw_clock

