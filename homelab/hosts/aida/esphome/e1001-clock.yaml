# Seeed reTerminal E1001 (ESP32-S3, 7.5" e-paper) as a wall clock + dashboard.
#
# The screen is a hybrid: the background is a PNG of an HA dashboard view
# (eink-dashboard-card, rendered by Puppet on aida and fetched from
# eink.home.malloc47.com), and the firmware draws the time and date into the
# card's blank clock area itself, so the clock keeps its per-minute partial
# refresh. Three pages, switched with the left/right buttons (the green
# button forces a full refresh); all backgrounds are prefetched, so switching
# needs no network:
#   0  /eink-panel/clock  dashboard, clock in x 214-586, y 10-176
#   1  /eink-panel/focus  big clock in x 146-654, y 8-184, weekday/date in the
#                         left column; today/tomorrow outlook below
#   2  /eink-panel/far    for reading at 6-9 ft: clock in x 160-640, y 8-180,
#                         larger weekday/date; big today/tomorrow rows
#
# The panel runs in 4-level grayscale (the UC8179 4-gray model from
# esphome/esphome#18470, installed as a local external component; see
# epaperSpiG4 in nixos/modules/home-automation.nix). Backgrounds are 4-gray;
# the clock, date and battery are drawn 1-bit, so the per-minute update stays a
# flash-free differential partial that leaves the grays alone. A background
# whose content changed (Puppet sends ETags; unchanged ones come back 304) also
# goes out as a partial when it's on screen, so routine changes don't flash:
# only pixels whose black/white value flips are driven, and they show 1-bit
# until the next full refresh restores their grays. Full 4-gray refreshes are
# kept for the hourly refresh, page switches, the green button and the first
# background after boot (and an HA push that asks for one; none do now).
#
# The firmware also draws the battery level (MDI icon + percentage) into a
# blank spot the card reserves at the right end of the footer (x 718-790), from
# its own reading rather than through HA, or a lightning bolt while on external
# power. It moves in 5% steps and, like the clock, is drawn 1-bit in black, so
# a change goes out with the next minute's partial update: no render change and
# no full refresh.
substitutions:
  name: e1001-clock
  friendly_name: e1001-clock
  api_key: !secret e1001_clock_api_key
  ota_password: !secret e1001_clock_ota_password
  ap_password: !secret e1001_clock_ap_password

packages:
  base: !include common/base.yaml

external_components:
  - source:
      type: local
      path: components
    components: [epaper_spi]

esphome:
  on_boot:
    priority: 600
    then:
      # Populate system time from the E1001's onboard RTC immediately.
      - pcf8563.read_time:
      # Power the battery voltage divider so the ADC can read it.
      - output.turn_on: bsp_battery_enable

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# 8 MB octal PSRAM (per Seeed's E1001 ESPHome guide); holds the background image.
psram:
  mode: octal
  speed: 80MHz

# Enable logging (on top of common/base.yaml)
logger:
  hardware_uart: UART0

# E1001 onboard RTC bus
i2c:
  scl: GPIO20
  sda: GPIO19

# E1001 e-paper SPI bus
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

time:
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    timezone: "America/New_York"
    update_interval: never

    on_time:
      - seconds: 0
        minutes: "*"
        then:
          - if:
              condition:
                lambda: |-
                  return id(rtc_time).now().minute == 0;
              then:
                - lambda: "id(pending_full) = true;"
          - script.execute: redraw

  - platform: homeassistant
    id: ha_time
    timezone: "America/New_York"

    on_time_sync:
      then:
        - pcf8563.write_time:

# Battery: ADC on GPIO1 behind a 2:1 divider enabled by GPIO21. The E1001 has
# no charge-status pin, so "external power" is inferred from the cell sitting
# at its charge voltage; the battery indicator shows a lightning bolt then.
output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0
    entity_category: diagnostic

  - platform: copy
    source_id: battery_voltage
    id: battery_level
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100
    on_value:
      - script.execute: battery_check

binary_sensor:
  # Top-edge buttons: left = previous page, right = next page, green = full
  # refresh now (GPIO5/GPIO4/GPIO3, active low; per Seeed's E1001 ESPHome
  # guide).
  - platform: gpio
    id: button_left
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - script.execute:
          id: show_page
          p: !lambda "return (id(page) + 3 - 1) % 3;"
  - platform: gpio
    id: button_right
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - script.execute:
          id: show_page
          p: !lambda "return (id(page) + 1) % 3;"
  # Redraws the current content with a full 4-gray refresh: clears ghosting
  # and restores grays that partial updates left 1-bit, without waiting for
  # the hourly one.
  - platform: gpio
    id: button_refresh
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
      # A strapping pin, but on the S3 only for JTAG source selection, which
      # needs an eFuse that isn't burned; Seeed wires the button here.
      ignore_strapping_warning: true
    on_press:
      - lambda: "id(pending_full) = true;"
      - script.execute: redraw

  - platform: template
    id: external_power
    name: "External Power"
    device_class: power
    lambda: |-
      return id(battery_voltage).state > 4.12;
    filters:
      - delayed_off: 5min
    on_state:
      - script.execute: battery_check

http_request:
  timeout: 20s
  watchdog_timeout: 25s

# Which page is on screen (see the header). Restored from flash (NVS) at boot,
# so the selection survives reboots, power loss and OTA updates (NVS isn't
# touched by OTA; the slot is keyed by the id, so keep it "page"). It's local,
# so HA outages don't affect it.
globals:
  - id: page
    type: int
    restore_value: true
    initial_value: "0"
  # A full 4-gray refresh is wanted (hourly, page switch, first background,
  # HA asking); consumed by the next redraw.
  - id: pending_full
    type: bool
    initial_value: "false"
  # Battery level on screen, in 5% steps; -1 lightning bolt (external power),
  # -2 no reading yet. Set by battery_check, drawn by the display lambda.
  - id: battery_shown
    type: int
    initial_value: "-2"
  # HA asked for a full refresh (refresh_dashboard with full): applied once
  # the visible page's background has been re-fetched, so the flash shows the
  # new content.
  - id: full_after_fetch
    type: bool
    initial_value: "false"

script:
  # Every display update goes through here. epaper_spi rejects an update while
  # a refresh is in progress (a full 4-gray one takes ~5s), which would drop a
  # page switch or a changed background, so wait for it to go idle first; a
  # new request just restarts the wait. A pending full is applied then, so a
  # minute tick arriving meanwhile can't downgrade it to a partial.
  - id: redraw
    mode: restart
    then:
      - wait_until:
          condition:
            not:
              epaper_spi.is_updating: epaper_display
          timeout: 60s
      - if:
          condition:
            lambda: "return id(pending_full);"
          then:
            - lambda: "id(pending_full) = false;"
            - epaper_spi.full_update_next: epaper_display
      - component.update: epaper_display
  # Move the battery indicator to a new 5% step (or to/from the bolt). Only
  # past 1.5% beyond the step's edge, so ADC noise around a boundary doesn't
  # flip it back and forth. The change goes out with the next minute tick's
  # (partial) redraw.
  - id: battery_check
    then:
      - lambda: |-
          int target;
          if (id(external_power).state) {
            target = -1;
          } else {
            float level = id(battery_level).state;
            if (std::isnan(level)) return;
            int shown = id(battery_shown);
            if (shown >= 0 && std::fabs(level - shown) < 4.0f) return;
            target = (int) std::lround(level / 5.0f) * 5;
          }
          if (target == id(battery_shown)) return;
          id(battery_shown) = target;
  # Show a page: full refresh, since the layouts differ too much for a
  # partial update to come out clean.
  - id: show_page
    parameters:
      p: int
    then:
      - lambda: "id(page) = p;"
      - script.execute: persist_page
      - lambda: "id(pending_full) = true;"
      - script.execute: redraw
  # Flush the new page to flash now rather than at the next 60s preferences
  # write, so a reboot/OTA right after switching keeps it. Delayed so the
  # globals component has stored the value first; restarts on rapid presses.
  - id: persist_page
    mode: restart
    then:
      - delay: 2s
      - lambda: "global_preferences->sync();"
  # A page's background finished downloading (changed: not a 304; first: its
  # first download since boot). Redraw if it's on screen: a partial, except
  # for the first background (a partial can't draw its grays) or when HA
  # asked for a full, which is applied even if the render didn't change.
  - id: background_ready
    parameters:
      p: int
      changed: bool
      first: bool
    then:
      - lambda: |-
          if (p != id(page)) return;
          bool full = first || id(full_after_fetch);
          id(full_after_fetch) = false;
          if (!changed && !full) return;
          if (full) id(pending_full) = true;
          id(redraw).execute();
  # Re-fetch every page's background (HA pushes, the HA button, Wi-Fi up).
  - id: refresh_backgrounds
    then:
      - component.update: dashboard_image
      - component.update: focus_image
      - component.update: far_image

image:
  - platform: online_image
    id: dashboard_image
    url: "https://eink.home.malloc47.com/eink-panel/clock?viewport=800x480&colors=000000,555555,AAAAAA,FFFFFF&format=png&wait=1500"
    format: PNG
    type: GRAYSCALE
    update_interval: 15min
    on_download_finished:
      - lambda: |-
          static bool first = true;
          id(background_ready).execute(0, !cached, first);
          first = false;
    # The first scheduled fetch runs at boot, before Wi-Fi is up; without a
    # retry the panel would show only the clock until the next interval.
    on_error:
      - delay: 30s
      - component.update: dashboard_image
  - platform: online_image
    id: focus_image
    url: "https://eink.home.malloc47.com/eink-panel/focus?viewport=800x480&colors=000000,555555,AAAAAA,FFFFFF&format=png&wait=1500"
    format: PNG
    type: GRAYSCALE
    update_interval: 15min
    on_download_finished:
      - lambda: |-
          static bool first = true;
          id(background_ready).execute(1, !cached, first);
          first = false;
    on_error:
      - delay: 30s
      - component.update: focus_image
  - platform: online_image
    id: far_image
    url: "https://eink.home.malloc47.com/eink-panel/far?viewport=800x480&colors=000000,555555,AAAAAA,FFFFFF&format=png&wait=1500"
    format: PNG
    type: GRAYSCALE
    update_interval: 15min
    on_download_finished:
      - lambda: |-
          static bool first = true;
          id(background_ready).execute(2, !cached, first);
          first = false;
    on_error:
      - delay: 30s
      - component.update: far_image

# Fetch the backgrounds as soon as the network is up (boot and reconnects).
# Merges with the wifi: block from common/base.yaml.
wifi:
  on_connect:
    - script.execute: refresh_backgrounds

# Let HA push refreshes instead of waiting for the 15-minute poll: the "E-ink
# panel" automation (home-automation.nix) calls
# esphome.e1001_clock_refresh_dashboard when something shown changes (weather,
# dishwasher, banner message, perimeter doors) with full: false, so they go
# out as partials; full: true would flash a full refresh once the new image
# lands. The button is the manual equivalent in HA's UI. A refresh
# re-fetches the Puppet renders, and the visible page redraws when its image
# lands.
# Merges with the api: block from common/base.yaml.
api:
  actions:
    - action: refresh_dashboard
      variables:
        full: bool
      then:
        - if:
            condition:
              lambda: "return full;"
            then:
              # Applied once the visible page's background is re-fetched.
              - lambda: "id(full_after_fetch) = true;"
        - script.execute: refresh_backgrounds

button:
  - platform: template
    name: "Refresh Dashboard"
    icon: mdi:refresh
    on_press:
      - script.execute: refresh_backgrounds

# The clock itself is block digits drawn by the display lambda (no font).
font:
  - file: "gfonts://Inter@600"
    id: date_font
    size: 26

  # Page 1's date, stacked beside the clock: weekday over "Oct 11".
  - file: "gfonts://Inter@600"
    id: side_weekday_font
    size: 24

  - file: "gfonts://Inter@700"
    id: side_date_font
    size: 34

  # Page 2 (far): a larger weekday/date.
  # Abbreviated weekday: "Wednesday" doesn't fit beside 12:58 at a size
  # readable across a room.
  - file: "gfonts://Inter@600"
    id: far_weekday_font
    size: 36

  - file: "gfonts://Inter@700"
    id: far_date_font
    size: 42

  # Battery indicator, matching the card's footer text (DejaVu Sans Bold, 15px)
  # and icons (MDI at 22px). Font files from esphomeFonts in home-automation.nix.
  # 1-bit black like the clock (not the card's muted gray), so changes can go
  # out as partial updates.
  - file: fonts/DejaVuSans-Bold.ttf
    id: battery_font
    size: 15
    glyphs: "0123456789%"

  - file: fonts/materialdesignicons-webfont.ttf
    id: battery_icons
    size: 22
    glyphs:
      - "\U000F0079" # battery
      - "\U000F007A" # battery-10
      - "\U000F007B" # battery-20
      - "\U000F007C" # battery-30
      - "\U000F007D" # battery-40
      - "\U000F007E" # battery-50
      - "\U000F007F" # battery-60
      - "\U000F0080" # battery-70
      - "\U000F0081" # battery-80
      - "\U000F0082" # battery-90
      - "\U000F10CD" # battery-alert-variant-outline
      - "\U000F140B" # lightning-bolt

display:
  - platform: epaper_spi
    id: epaper_display
    model: waveshare-7.5in-v2-4gray
    # The E1001's wiring (as in the built-in seeed-reterminal-e1001 model).
    cs_pin: GPIO10
    dc_pin: GPIO11
    reset_pin: GPIO12
    busy_pin:
      number: GPIO13
      inverted: true
      mode:
        input: true
        pullup: true

    update_interval: never

    # Updates are differential partials (1-bit, grays untouched) unless a full
    # 4-gray refresh is requested (changed background, page switch, hourly);
    # the automatic fallback is much longer than the hourly forced refresh.
    full_update_every: 255

    lambda: |-
      // Block-digit clock: the classic 5x7 digit shapes with every cell drawn
      // as 2x2 square blocks (so strokes are two blocks wide), blocks on a
      // pitch of p px, centred on cx with the bottom at `bottom`. One cell of
      // spacing between characters; the colon is one cell wide.
      auto block_clock = [&](int cx, int bottom, int p, int hour, int minute) {
        static const uint8_t DIGITS[10][7] = {  // rows, bit 4 = leftmost column
            {0x0E, 0x11, 0x11, 0x11, 0x11, 0x11, 0x0E}, {0x04, 0x0C, 0x04, 0x04, 0x04, 0x04, 0x0E},
            {0x0E, 0x11, 0x01, 0x02, 0x04, 0x08, 0x1F}, {0x1F, 0x02, 0x04, 0x02, 0x01, 0x11, 0x0E},
            {0x02, 0x06, 0x0A, 0x12, 0x1F, 0x02, 0x02}, {0x1F, 0x10, 0x1E, 0x01, 0x01, 0x11, 0x0E},
            {0x06, 0x08, 0x10, 0x1E, 0x11, 0x11, 0x0E}, {0x1F, 0x01, 0x02, 0x04, 0x08, 0x08, 0x08},
            {0x0E, 0x11, 0x11, 0x0E, 0x11, 0x11, 0x0E}, {0x0E, 0x11, 0x11, 0x0F, 0x01, 0x02, 0x0C}};
        // Gap between blocks: tight (1-2px); `airy` widens it to about a
        // third of the pitch.
        const bool airy = false;
        const int gap = airy ? std::max(2, p / 3) : std::max(1, p / 5);
        const int b = p - gap, cell = 2 * p;
        auto draw_cell = [&](int x, int y) {
          for (int dy = 0; dy < 2; dy++)
            for (int dx = 0; dx < 2; dx++)
              it.filled_rectangle(x + dx * p, y + dy * p, b, b, Color::BLACK);
        };
        char s[8];
        snprintf(s, sizeof(s), "%d:%02d", hour, minute);
        int cols = -1;
        for (const char *c = s; *c; c++) cols += (*c == ':' ? 1 : 5) + 1;
        int x = cx - (cols * cell - gap) / 2;
        const int top = bottom - 7 * cell + gap;
        for (const char *c = s; *c; c++) {
          if (*c == ':') {
            draw_cell(x, top + 2 * cell);
            draw_cell(x, top + 4 * cell);
            x += 2 * cell;
            continue;
          }
          const uint8_t *g = DIGITS[*c - '0'];
          for (int r = 0; r < 7; r++)
            for (int k = 0; k < 5; k++)
              if (g[r] & (0x10 >> k)) draw_cell(x + k * cell, top + r * cell);
          x += 6 * cell;
        }
      };

      it.fill(Color::WHITE);

      // Background: the page's 4-gray Puppet render (each pixel's gray blends
      // from off=black to on=white, so levels map straight through). Empty
      // until its first download finishes, leaving just the clock.
      it.image(0, 0,
               id(page) == 2 ? id(far_image) : id(page) == 1 ? id(focus_image) : id(dashboard_image),
               Color::WHITE, Color::BLACK);

      // Battery: icon + "NN%" (or a lightning bolt on external power)
      // right-aligned in the card's blank footer spot (x 718-790), vertically
      // centred like the card's footer row: y 453 on the dashboard (footer
      // y 428-480), 455 on focus/far (432-480).
      int shown = id(battery_shown);
      if (shown == -1) {
        it.print(790, (id(page) == 0 ? 453 : 455) - 11, id(battery_icons), Color::BLACK,
                 TextAlign::TOP_RIGHT, "\U000F140B");
      } else if (shown >= 0) {
        static const char *const ICONS[] = {
            "\U000F007A", "\U000F007B", "\U000F007C", "\U000F007D", "\U000F007E",
            "\U000F007F", "\U000F0080", "\U000F0081", "\U000F0082", "\U000F0079"};
        int cy = id(page) == 0 ? 453 : 455;
        char text[12];
        snprintf(text, sizeof(text), "%d%%", shown);
        int x1, y1, w, h;
        it.get_text_bounds(790, cy + 5, text, id(battery_font), TextAlign::BASELINE_RIGHT,
                           &x1, &y1, &w, &h);
        it.print(790, cy + 5, id(battery_font), Color::BLACK, TextAlign::BASELINE_RIGHT, text);
        const char *glyph = shown <= 5 ? "\U000F10CD"
                                       : ICONS[std::min(std::max((shown + 5) / 10, 1), 10) - 1];
        it.print(x1 - 4 - 22, cy - 11, id(battery_icons), Color::BLACK, TextAlign::TOP_LEFT, glyph);
      }

      auto now = id(rtc_time).now();
      if (now.is_valid()) {
        int h = now.hour % 12;
        if (h == 0) h = 12;
        if (id(page) == 2) {
          // Far clock area: x 160-640, y 8-180; weekday and date in the left
          // column (x 0-160), sized for reading across a room.
          block_clock(400, 160, 9, h, now.minute);
          it.printf(82, 80, id(far_weekday_font), Color::BLACK, TextAlign::BASELINE_CENTER,
                    "%s", now.strftime("%a").c_str());
          it.printf(82, 132, id(far_date_font), Color::BLACK, TextAlign::BASELINE_CENTER,
                    "%s %d", now.strftime("%b").c_str(), now.day_of_month);
        } else if (id(page) == 1) {
          // Big clock area: x 146-654, y 8-184 (left blank by the focus card);
          // weekday and date in the left column above the card's sunrise/sunset.
          block_clock(400, 168, 10, h, now.minute);
          it.printf(73, 70, id(side_weekday_font), Color::BLACK, TextAlign::BASELINE_CENTER,
                    "%s", now.strftime("%A").c_str());
          it.printf(73, 112, id(side_date_font), Color::BLACK, TextAlign::BASELINE_CENTER,
                    "%s %d", now.strftime("%b").c_str(), now.day_of_month);
        } else {
          // Clock area: x 214-586, y 10-176 (left blank by the card).
          block_clock(400, 116, 7, h, now.minute);
          it.printf(400, 160, id(date_font), Color::BLACK, TextAlign::BASELINE_CENTER,
                    "%s %d", now.strftime("%A, %B").c_str(), now.day_of_month);
        }
      }
