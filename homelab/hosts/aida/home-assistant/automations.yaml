- id: '1791084564016'
  alias: Play Room Lamp follows Play Room Light Switch
  description: 'Mirror the Play Room Light Switch relay (Sonoff ZBMINIR2) onto the
    Play Room Lamp plug (SONOFF S61 0xa4c1381f2ed8ffff since 2026-11-05; replaced
    a Third Reality Gen3 plug). Interim until the ZBMINIR2 is replaced: it cannot
    drive the lamp over a Zigbee binding (it only sends toggle, and only in detach-relay
    mode).'
