- id: '1786655181397'
  alias: Door Notifications
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.front_door_contact
    - binary_sensor.side_door_contact
    - binary_sensor.utility_room_door_contact
    - binary_sensor.dining_room_sliding_door_contact
    - binary_sensor.basement_door_contact
    - binary_sensor.west_gate_contact
    - binary_sensor.east_gate_contact
    from:
    - 'off'
    - 'on'
    to:
    - 'off'
    - 'on'
  conditions:
  - condition: state
    entity_id: input_select.alert_level
    state:
    - All Notifications
    - Silent Notifications
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.state == ''on'' }}'
      sequence:
      - parallel:
        - action: notify.mobile_app_motorola_razr_plus_2024
          metadata: {}
          data:
            message: '{{ trigger.to_state.name }} is open'
            data:
              tag: '{{ trigger.entity_id }}'
              ttl: 0
              priority: high
        - if:
          - condition: time
            after: 08:00:00
            before: '21:00:00'
          - condition: state
            entity_id: input_select.alert_level
            state:
            - All Notifications
          then:
          - action: reolink.play_chime
            metadata: {}
            data:
              device_id:
              - 6f6ee06524038b5c0a29595d3c617eb8
              - 77c6615345b4cf871dd1e121caaeae31
              ringtone: pianokey
    default:
    - action: notify.mobile_app_motorola_razr_plus_2024
      metadata: {}
      data:
        message: clear_notification
        data:
          tag: '{{ trigger.entity_id }}'
  mode: queued
  max: 10
