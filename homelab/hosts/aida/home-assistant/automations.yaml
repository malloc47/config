- id: '1789880035248'
  alias: Kids Room Door Night Notifications
  description: 'Between 8pm and 5am, when the kids room door opens (a kid has left
    their room): turns on the Living Room Notification Light (red) as a visual indicator
    AND sends a sticky notification to all phones. When the door closes — or at 5am
    when the window ends — the light is turned off and the notification cleared. Merged
    from the former ''Kids Door Notification'' light automation so the light now shares
    the 8pm-5am window. Tag-based clear mirrors the Garden Hose Valve / Door Notifications
    pattern.'
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.kids_room_door_contact
    from:
    - 'off'
    - 'on'
    to:
    - 'on'
    - 'off'
  - trigger: time
    at: 05:00:00
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: state
        entity_id: binary_sensor.kids_room_door_contact
        state: 'on'
      - condition: time
        after: '20:00:00'
        before: 05:00:00
      sequence:
      - parallel:
        - action: light.turn_on
          metadata: {}
          target:
            entity_id: light.dining_room_night_light
          data:
            rgb_color:
            - 255
            - 63
            - 33
        - action: notify.mobile_app_motorola_razr_plus_2024
          metadata: {}
          data:
            title: "\U0001F6AA Kids Room Door Opened"
            message: Someone left the kids' room
            data:
              tag: binary_sensor.kids_room_door_contact
              ttl: 0
              priority: high
              importance: high
              channel: Kids Room Door
              sticky: true
        - action: notify.mobile_app_pixel_8_pro
          metadata: {}
          data:
            title: "\U0001F6AA Kids Room Door Opened"
            message: Someone left the kids' room
            data:
              tag: binary_sensor.kids_room_door_contact
              ttl: 0
              priority: high
              importance: high
              channel: Kids Room Door
              sticky: true
    default:
    - parallel:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id: light.dining_room_night_light
        data:
          transition: 1
      - action: notify.mobile_app_motorola_razr_plus_2024
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: binary_sensor.kids_room_door_contact
      - action: notify.mobile_app_pixel_8_pro
        metadata: {}
        data:
          message: clear_notification
          data:
            tag: binary_sensor.kids_room_door_contact
  mode: queued
  max: 10
