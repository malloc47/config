- id: '1787455680831'
  alias: Front porch light on front door open
  description: When the front door opens after dark and the porch light is off, turn
    it on. Once the door has stayed closed for 5 minutes, turn it back off — but only
    if this automation is the one that turned it on. Re-opening the door within the
    5 minutes restarts the countdown.
  triggers:
  - trigger: state
    entity_id: binary_sensor.front_door_contact
    from: 'off'
    to: 'on'
  conditions:
  - condition: state
    entity_id: light.front_porch_light
    state: 'off'
  - condition: state
    entity_id: sensor.front_door_day_night_state
    state:
    - night
  actions:
  - action: light.turn_on
    target:
      entity_id: light.front_porch_light
  - repeat:
      sequence:
      - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.front_door_contact
          to: 'off'
      - wait_for_trigger:
        - trigger: state
          entity_id: binary_sensor.front_door_contact
          to: 'on'
        timeout:
          minutes: 5
        continue_on_timeout: true
      until:
      - condition: template
        value_template: '{{ wait.trigger is none }}'
  - action: light.turn_off
    target:
      entity_id: light.front_porch_light
  mode: restart
- id: '1787608459252'
  alias: Living room knob - multi-mode control
  description: ' [Option B round 1: honor knob action_transition_time for smooth blended
    ramping; max 3->10; filter to real actions.]'
  triggers:
  - trigger: mqtt
    topic: zigbee2mqtt/Rotating button
  conditions:
  - condition: template
    value_template: '{{ (trigger.payload_json.action | default('''')) in [''toggle'',
      ''hue_move'', ''brightness_step_up'', ''brightness_step_down''] }}'
  actions:
  - variables:
      action: '{{ trigger.payload_json.action }}'
      active: '{{ states(''input_select.living_room_knob_mode'') }}'
      dir: '{{ 1 if trigger.payload_json.action == ''brightness_step_up'' else -1
        }}'
      size: '{{ trigger.payload_json.action_step_size | float(25) }}'
      trans: '{{ trigger.payload_json.action_transition_time | float(0.2) }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action == ''toggle'' }}'
      sequence:
      - action: input_select.select_next
        target:
          entity_id: input_select.living_room_knob_mode
    - conditions:
      - '{{ action == ''hue_move'' }}'
      sequence:
      - variables:
          def_k: '{{ states(''input_select.light_temperature'') | float(3000) }}'
      - action: input_number.set_value
        target:
          entity_id: input_number.living_room_overhead_lights_temperature
        data:
          value: '{{ def_k }}'
      - action: input_select.select_option
        target:
          entity_id: input_select.living_room_knob_mode
        data:
          option: temp
      - action: light.turn_on
        target:
          entity_id: light.living_room_overhead_lights
        data:
          transition: 0
          color_temp_kelvin: '{{ def_k | int }}'
    - conditions:
      - condition: template
        value_template: '{{ action in [''brightness_step_up'', ''brightness_step_down'']
          }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ active == ''temp'' }}'
          sequence:
          - variables:
              new_k: "{{ [[ (states('input_number.living_room_overhead_lights_temperature')
                | float(3000)) + dir * size * 5,\n      2000 ] | max, 6500 ] | min
                }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.living_room_overhead_lights_temperature
            data:
              value: '{{ new_k }}'
          - action: light.turn_on
            target:
              entity_id: light.living_room_overhead_lights
            data:
              transition: '{{ trans }}'
              color_temp_kelvin: '{{ new_k | int }}'
        - conditions:
          - condition: template
            value_template: '{{ active == ''hue'' }}'
          sequence:
          - variables:
              new_h: '{{ (states(''input_number.living_room_overhead_lights_state'')
                | float(0) + dir * size * 0.5) % 360 }}'
          - action: input_number.set_value
            target:
              entity_id: input_number.living_room_overhead_lights_state
            data:
              value: '{{ new_h }}'
          - action: light.turn_on
            target:
              entity_id: light.living_room_overhead_lights
            data:
              transition: '{{ trans }}'
              hs_color:
              - '{{ new_h }}'
              - 100
        - conditions:
          - condition: template
            value_template: '{{ active == ''brightness'' }}'
          sequence:
          - variables:
              new_b: "{{ [[ (states('input_number.living_room_overhead_lights_brightness')
                | float(128)) + dir * size,\n      1 ] | max, 255 ] | min }}"
          - action: input_number.set_value
            target:
              entity_id: input_number.living_room_overhead_lights_brightness
            data:
              value: '{{ new_b }}'
          - action: light.turn_on
            target:
              entity_id: light.living_room_overhead_lights
            data:
              transition: '{{ trans }}'
              brightness: '{{ new_b | int }}'
  mode: queued
  max: 10
  max_exceeded: silent
