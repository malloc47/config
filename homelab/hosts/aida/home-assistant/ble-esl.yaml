# Bluetooth e-paper shelf labels (ble_esl integration; docs/ble-esl.md).
#
# Loaded as the `ble_esl` Home Assistant package (modules/home-automation.nix),
# so it is Nix-owned: not editable from the UI and not part of ha-foldin.
#
#   ESL 4.2" (PSJ-420, 400x300 BWRY)  image.esl_420_*  — the 2.9"'s day full width
#                                     (same rules), the five days after it, and a
#                                     footer with the message and now
#   ESL 2.9" (PSJ-290, 296x128 BWRY)  image.esl_290_*  — kids' room: the day ahead
#                                     (today before noon, tomorrow after); banner
#                                     red on daycare/school/after-care exception
#                                     days; footer: exception, notices, now
#
# Data is NWS (weather.nws_khpn): twice_daily day/night periods and hourly.
# When NWS is unavailable the run is skipped, so the labels keep the last good
# image rather than showing blanks. Writes are guarded (Prevent Duplicate Send
# is on for both tags), so an unchanged image costs no BLE airtime or battery.
#
# Preview without touching the panels: run script.esl_weather_render with
# dry_run: true, then look at image.esl_420_preview_content /
# image.esl_290_preview_content.
#
# A write that fails after all retries notifies the phone (esl_write_failed),
# which is the signal that a tag has been moved out of range.

script:
  esl_weather_render:
    alias: "ESL: render weather labels"
    description: Render the NWS forecast onto the 4.2" and 2.9" e-paper labels.
    mode: queued
    max: 2
    fields:
      dry_run:
        description: Render the previews only; send nothing to the tags.
        default: false
        # `boolean:` rather than `boolean: {}`: HA's package merge drops
        # empty mappings, which leaves an invalid empty selector.
        selector:
          boolean:
      forecast_day:
        description: >-
          Which day the 2.9" shows. auto = today before noon, tomorrow from
          noon on; today/tomorrow force one, for previewing both layouts.
        default: auto
        selector:
          select:
            options:
              - auto
              - today
              - tomorrow
    sequence:
      - condition: template
        value_template: "{{ states('weather.nws_khpn') not in ['unavailable', 'unknown'] }}"
      - action: weather.get_forecasts
        target:
          entity_id: weather.nws_khpn
        data:
          type: twice_daily
        response_variable: twice_daily
      - action: weather.get_forecasts
        target:
          entity_id: weather.nws_khpn
        data:
          type: hourly
        response_variable: hourly
      - variables:
          dry: "{{ dry_run | default(false) | bool }}"
          # "Today" for everything date-relative below, as a string: a test
          # harness can override it to replay a past day's calendars.
          today_date: "{{ now().date() | string }}"
          periods: "{{ twice_daily['weather.nws_khpn'].forecast }}"
          all_hours: "{{ hourly['weather.nws_khpn'].forecast }}"
          hours: "{{ hourly['weather.nws_khpn'].forecast[:24] }}"
          night: "{{ is_state('sun.sun', 'below_horizon') }}"
          icons:
            clear-night: mdi:weather-night
            cloudy: mdi:weather-cloudy
            exceptional: mdi:alert-circle-outline
            fog: mdi:weather-fog
            hail: mdi:weather-hail
            lightning: mdi:weather-lightning
            lightning-rainy: mdi:weather-lightning-rainy
            partlycloudy: mdi:weather-partly-cloudy
            pouring: mdi:weather-pouring
            rainy: mdi:weather-rainy
            snowy: mdi:weather-snowy
            snowy-rainy: mdi:weather-snowy-rainy
            sunny: mdi:weather-sunny
            windy: mdi:weather-windy
            windy-variant: mdi:weather-windy-variant
          # Advance widths (em) of the bundled NotoSansKR Bold / Regular, measured
          # with PIL, so templates can tell whether a line fits; summing them
          # overestimates kerned text by about a pixel, which errs on the safe side.
          adv_bold: {'a': 0.591, 'b': 0.644, 'c': 0.527, 'd': 0.644, 'e': 0.581, 'f': 0.372, 'g': 0.597, 'h': 0.64, 'i': 0.304, 'j': 0.306, 'k': 0.604, 'l': 0.315, 'm': 0.964, 'n': 0.641, 'o': 0.626, 'p': 0.644, 'q': 0.644, 'r': 0.437, 's': 0.495, 't': 0.421, 'u': 0.637, 'v': 0.576, 'w': 0.863, 'x': 0.562, 'y': 0.574, 'z': 0.511, 'A': 0.641, 'B': 0.681, 'C': 0.656, 'D': 0.714, 'E': 0.615, 'F': 0.585, 'G': 0.717, 'H': 0.757, 'I': 0.33, 'J': 0.568, 'K': 0.686, 'L': 0.578, 'M': 0.853, 'N': 0.749, 'O': 0.77, 'P': 0.667, 'Q': 0.77, 'R': 0.682, 'S': 0.624, 'T': 0.625, 'U': 0.748, 'V': 0.619, 'W': 0.915, 'X': 0.627, 'Y': 0.58, 'Z': 0.613, '0': 0.59, '1': 0.59, '2': 0.59, '3': 0.59, '4': 0.59, '5': 0.59, '6': 0.59, '7': 0.59, '8': 0.59, '9': 0.59, ' ': 0.227, ',': 0.325, '.': 0.325, '(': 0.378, ')': 0.378, '%': 0.963, '–': 0.544, '…': 1.0, '-': 0.37, "'": 0.325, '°': 0.404, ':': 0.325}
          adv_regular: {'a': 0.563, 'b': 0.618, 'c': 0.51, 'd': 0.62, 'e': 0.554, 'f': 0.325, 'g': 0.564, 'h': 0.607, 'i': 0.275, 'j': 0.275, 'k': 0.552, 'l': 0.284, 'm': 0.926, 'n': 0.61, 'o': 0.606, 'p': 0.62, 'q': 0.62, 'r': 0.388, 's': 0.468, 't': 0.377, 'u': 0.607, 'v': 0.521, 'w': 0.802, 'x': 0.498, 'y': 0.521, 'z': 0.475, 'A': 0.608, 'B': 0.657, 'C': 0.638, 'D': 0.688, 'E': 0.589, 'F': 0.552, 'G': 0.689, 'H': 0.728, 'I': 0.293, 'J': 0.535, 'K': 0.646, 'L': 0.543, 'M': 0.812, 'N': 0.723, 'O': 0.742, 'P': 0.633, 'Q': 0.742, 'R': 0.635, 'S': 0.596, 'T': 0.599, 'U': 0.721, 'V': 0.575, 'W': 0.878, 'X': 0.573, 'Y': 0.531, 'Z': 0.603, '0': 0.555, '1': 0.555, '2': 0.555, '3': 0.555, '4': 0.555, '5': 0.555, '6': 0.555, '7': 0.555, '8': 0.555, '9': 0.555, ' ': 0.224, ',': 0.278, '.': 0.278, '(': 0.338, ')': 0.338, '%': 0.921, '–': 0.536, '…': 1.0, '-': 0.347, "'": 0.278, '°': 0.37, ':': 0.278}
          names:
            clear-night: Clear
            cloudy: Cloudy
            exceptional: Alert
            fog: Fog
            hail: Hail
            lightning: Storms
            lightning-rainy: T-storms
            partlycloudy: Partly cloudy
            pouring: Heavy rain
            rainy: Rain
            snowy: Snow
            snowy-rainy: Wintry mix
            sunny: Sunny
            windy: Windy
            windy-variant: Windy
      - condition: template
        value_template: "{{ periods | count >= 4 and hours | count > 0 }}"
      - variables:
          now_temp: "{{ state_attr('weather.nws_khpn', 'temperature') | round(0) | int }}"
          now_cond: "{{ states('weather.nws_khpn') }}"
          # NWS reports the night sky as sunny/partlycloudy too.
          now_icon: >-
            {% set c = states('weather.nws_khpn') %}
            {% if night and c == 'sunny' %}mdi:weather-night
            {% elif night and c == 'partlycloudy' %}mdi:weather-night-partly-cloudy
            {% else %}{{ icons.get(c, 'mdi:weather-cloudy') }}{% endif %}
          now_name: >-
            {% set c = states('weather.nws_khpn') %}
            {{ 'Clear' if night and c == 'sunny' else names.get(c, c) }}
          humidity: "{{ state_attr('weather.nws_khpn', 'humidity') | round(0) | int }}"
          wind: >-
            {% set b = state_attr('weather.nws_khpn', 'wind_bearing') %}
            {% set dirs = ['N','NE','E','SE','S','SW','W','NW'] %}
            {{ state_attr('weather.nws_khpn', 'wind_speed') | round(0) | int }} mph
            {{- ' ' ~ dirs[((b | float(0) + 22.5) // 45) | int % 8] if b is number else '' }}
          stamp: "{{ now().strftime('%-I %p') }}"
          # 2.9": the day to get ready for — today before noon, tomorrow from
          # noon on (the evening look at tomorrow).
          tomorrow: >-
            {% set f = forecast_day | default('auto') %}
            {{ f == 'tomorrow' or (f == 'auto' and now().hour >= 12) }}
      - variables:
          want: "{{ (as_datetime(today_date) + timedelta(days=1 if tomorrow else 0)).date() | string }}"
      - variables:
          # Falls back to the next daytime period when that day has none left
          # (today, late); everything below follows the period actually picked.
          day: >-
            {{ periods | selectattr('is_daytime') | selectattr('datetime', 'match', want)
               | list | first | default(periods | selectattr('is_daytime') | first, true) }}
      - variables:
          # A string ("2026-11-08"): script variables don't keep date objects.
          day_date: "{{ (as_datetime(day.datetime) | as_local).date() | string }}"
      # The kids' calendars over the kitchen card's regular_schedule window
      # (lookaround 14 around a 7-day view starting today, padded a day like
      # its fetch), and the calendar-alert calendar for the shown day.
      - action: calendar.get_events
        target:
          entity_id:
            - calendar.kids_school
            - calendar.bastian
            - calendar.charisrebecca_gmail_com
        data:
          start_date_time: "{{ (as_datetime(today_date) - timedelta(days=15)).strftime('%Y-%m-%d 00:00:00') }}"
          end_date_time: "{{ (as_datetime(today_date) + timedelta(days=23)).strftime('%Y-%m-%d 00:00:00') }}"
        response_variable: cal
      - variables:
          # Exception days, as the kitchen card's "Regular schedule" strip
          # finds them (family-calendar-card.js _regular(); keep in step with
          # family-calendar-dashboard.yaml's regular_schedule). The routine is
          # the timed events with the same calendar, title and start/end times
          # that are among the visible days (a week from today) and fall on at
          # least 3 weekdays there, or within one Monday-Sunday week of the
          # fetched events. A weekday is an exception when any of a calendar's
          # routine is missing from it. Each visible day also gets its
          # schedule items for the 4.2"'s note line.
          #
          # The footer says what is missing: "No kindergarten, after-care" or,
          # when a same-named event replaces it at other times,
          # "Kindergarten (half-day), after-care from 11:35 AM". Short markers
          # (pick-ups and anything of 15 min or less, like the bus) are only
          # named when nothing else is missing. texts: fullest wording first.
          excs: >-
            {%- set routine_cals = ['calendar.kids_school', 'calendar.bastian'] -%}
            {%- set today = as_datetime(today_date) -%}
            {%- set vis = namespace(days=[], all=[]) -%}
            {%- for i in range(7) -%}
              {%- set d = today + timedelta(days=i) -%}
              {%- set vis.all = vis.all + [d.strftime('%Y-%m-%d')] -%}
              {%- if d.isoweekday() <= 5 %}{% set vis.days = vis.days + [d.strftime('%Y-%m-%d')] %}{% endif -%}
            {%- endfor -%}
            {%- macro tidy(t) -%}
              {#- family-calendar-dashboard.yaml's title_rewrites -#}
              {{- t | replace('Discovery Village ', '') | replace('Transfiguration ', '')
                    | regex_replace(' \\([A-Z]+ \\d+ [AP]M\\)', '') | trim -}}
            {%- endmacro -%}
            {%- macro lc(t) %}{{ t[0] | lower ~ t[1:] }}{% endmacro -%}
            {%- macro hm(t) -%}{{ t.strftime('%-I:%M %p') | replace(':00', '') }}{%- endmacro -%}
            {#- The kids' single-day timed events. A series key is calendar,
                folded title, start time and duration, as the card's keyOf. -#}
            {%- set ev = namespace(l=[]) -%}
            {%- for c in routine_cals -%}
              {%- for e in cal[c].events | default([]) if 'T' in e.start -%}
                {%- set st = as_datetime(e.start) | as_local %}{% set en = as_datetime(e.end) | as_local -%}
                {%- set dur = ((en - st).total_seconds() // 60) | int -%}
                {%- if st.date() == (en - timedelta(seconds=1)).date() -%}
                  {%- set folded = e.summary | lower | regex_replace('[^a-z0-9]+', ' ') | trim -%}
                  {%- set ev.l = ev.l + [{
                      'cal': c,
                      'k': c ~ '|' ~ folded ~ '|' ~ st.strftime('%H:%M') ~ '|' ~ dur,
                      'folded': folded, 'title': e.summary, 'dur': dur,
                      'weekday': st.isoweekday() <= 5,
                      'date': st.strftime('%Y-%m-%d'),
                      'week': (st - timedelta(days=st.isoweekday() - 1)).strftime('%Y-%m-%d'),
                      'start': st, 'end': en,
                      'marker': dur <= 15 or folded is match('pick ?up\\b')}] -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {#- The routine: series on the visible weekdays that fall on at
                least 3 weekdays there or within one Monday-Sunday week. In
                calendar order, then by first visible occurrence. -#}
            {%- set wd = ev.l | selectattr('weekday') | list -%}
            {%- set rt = namespace(l=[], keys=[]) -%}
            {%- for c in routine_cals -%}
              {%- for o in wd | selectattr('cal', 'eq', c) | selectattr('date', 'in', vis.days) | sort(attribute='start') -%}
                {%- if o.k not in rt.keys -%}
                  {%- set mine = wd | selectattr('k', 'eq', o.k) | list -%}
                  {%- set nvis = mine | selectattr('date', 'in', vis.days) | map(attribute='date') | unique | list | count -%}
                  {%- set wk = namespace(max=0) -%}
                  {%- for w in mine | map(attribute='week') | unique -%}
                    {%- set n = mine | selectattr('week', 'eq', w) | map(attribute='date') | unique | list | count -%}
                    {%- if n > wk.max %}{% set wk.max = n %}{% endif -%}
                  {%- endfor -%}
                  {%- set rt.keys = rt.keys + [o.k] -%}
                  {%- if nvis >= 3 or wk.max >= 3 %}{% set rt.l = rt.l + [o] %}{% endif -%}
                {%- endif -%}
              {%- endfor -%}
            {%- endfor -%}
            {%- set routine_keys = rt.l | map(attribute='k') | list -%}
            {%- set res = namespace(m={}) -%}
            {%- for D in vis.all -%}
              {%- set onD = ev.l | selectattr('date', 'eq', D) | list -%}
              {%- set onD_keys = onD | map(attribute='k') | list -%}
              {%- set out = namespace(no=[], changed=[], minor=[]) -%}
              {%- if D in vis.days -%}
                {%- for o in rt.l if o.k not in onD_keys -%}
                  {%- set title = tidy(o.title) -%}
                  {%- if o.marker -%}
                    {%- set out.minor = out.minor + [title] -%}
                  {%- else -%}
                    {%- set alt = onD | selectattr('cal', 'eq', o.cal) | selectattr('folded', 'match', o.folded) | first | default(none) -%}
                    {%- if alt is none -%}
                      {%- set out.no = out.no + [title] -%}
                    {%- elif alt.folded == o.folded -%}
                      {%- set out.changed = out.changed + [title ~ (' from ' ~ hm(alt.start) if alt.start.strftime('%H:%M') != o.start.strftime('%H:%M') else ' until ' ~ hm(alt.end))] -%}
                    {%- else -%}
                      {%- set out.changed = out.changed + [tidy(alt.title)] -%}
                    {%- endif -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endif -%}
              {%- set no = out.no if out.no or out.changed else out.minor -%}
              {%- set parts = [] -%}
              {%- if no %}{% set parts = parts + ['No ' ~ (no | map('lower') | join(', '))] %}{% endif -%}
              {%- if out.changed -%}
                {%- set ch = namespace(l=[]) -%}
                {%- for t in out.changed %}{% set ch.l = ch.l + [t if loop.first and not no else lc(t)] %}{% endfor -%}
                {%- set parts = parts + [ch.l | join(', ')] -%}
              {%- endif -%}
              {%- set full = parts | join('; ') -%}
              {#- The day's schedule: its action times (markers: the bus,
                  pick-ups) and whatever is outside the routine (a parade; on
                  weekends, everything), by time, a pick-up shared by both
                  calendars once. -#}
              {%- set it = namespace(l=[], seen=[]) -%}
              {%- for e in onD | sort(attribute='start') if e.marker or e.k not in routine_keys -%}
                {%- set id = e.folded ~ '|' ~ e.start.strftime('%H:%M') -%}
                {%- if id not in it.seen -%}
                  {%- set it.seen = it.seen + [id] -%}
                  {%- set it.l = it.l + [tidy(e.title) ~ ' ' ~ hm(e.start)] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set res.m = dict(res.m, **{D: {'missing': (no or out.changed) | count > 0,
                  'texts': ([full, full | regex_replace(' [AP]M', '')] | unique | list) if full else [],
                  'items': it.l}}) -%}
            {%- endfor -%}
            {{ res.m }}
          # Persistent notices from the E1001/kitchen banner (lovelace-common/
          # banner.js; keep calendar_alerts in step with eink-panel-dashboard.yaml):
          # the free-text message (input_text.eink_banner) and calendar alerts
          # on the shown day. The banner's dishwasher and open doors are
          # moment-to-moment, so they are left out of a label redrawn every 3 h.
          message: >-
            {%- set msg = states('input_text.eink_banner') -%}
            {{ msg if msg not in ['', 'unknown', 'unavailable'] else '' }}
          # Calendar alerts by date, for the visible week and the day after.
          alerts_by_day: >-
            {%- set alerts = [{'entity': 'calendar.charisrebecca_gmail_com', 'match': '^Humira$', 'icon': 'mdi:needle'}] -%}
            {%- set res = namespace(m={}) -%}
            {%- for i in range(8) -%}
              {%- set D = (as_datetime(today_date) + timedelta(days=i)).strftime('%Y-%m-%d') -%}
              {%- set out = namespace(l=[]) -%}
              {%- for a in alerts -%}
                {%- for ev in cal[a.entity].events | default([]) -%}
                  {%- if 'T' in ev.start -%}
                    {%- set first = (as_datetime(ev.start) | as_local).strftime('%Y-%m-%d') -%}
                    {%- set last = (as_datetime(ev.end) | as_local - timedelta(seconds=1)).strftime('%Y-%m-%d') -%}
                  {%- else -%}
                    {%- set first = ev.start -%}
                    {%- set last = (as_datetime(ev.end) - timedelta(days=1)).strftime('%Y-%m-%d') -%}
                  {%- endif -%}
                  {%- if first <= D <= last and ev.summary is match(a.match, ignorecase=true)
                         and ev.summary not in out.l | map(attribute='text') | list -%}
                    {%- set out.l = out.l + [{'icon': a.icon, 'text': ev.summary}] -%}
                  {%- endif -%}
                {%- endfor -%}
              {%- endfor -%}
              {%- if out.l %}{% set res.m = dict(res.m, **{D: out.l}) %}{% endif -%}
            {%- endfor -%}
            {{ res.m }}
      - variables:
          # Per-day panels: the day both labels show (panels[0]: today before
          # noon, tomorrow from noon). A list so more days can be added.
          # Each covers its day's outdoor hours, 7 AM-10 PM like the E1001
          # and kitchen cards' outdoor_hours: [7, 22] (for today, what is
          # left of them): their range and wet hours are what the kids dress
          # and pack for; the overnight lows either side are not. The high
          # also takes NWS's daytime high.
          #
          # outlook is the "what to wear" outlook, ported from
          # lovelace-common/weather.js outlookRow() (the E1001 and kitchen
          # cards) with their thresholds: an hour is wet at >= 50% chance,
          # coat below 45 °F, hot from 85 °F. Its texts run from most to least
          # detailed; the render picks one that fits. Its icon is the worst
          # condition when it rains, else the usual one.
          panels: >-
            {%- macro hl(h) -%}
              {{- 'midnight' if h % 24 == 0 else 'noon' if h % 24 == 12
                  else ((h % 12) or 12) ~ (' AM' if h % 24 < 12 else ' PM') -}}
            {%- endmacro -%}
            {%- macro hr(a, b) -%}
              {%- set la = hl(a) %}{% set lb = hl(b) -%}
              {%- set pa = la.split(' ') %}{% set pb = lb.split(' ') -%}
              {{- pa[0] ~ '–' ~ lb if pa | count > 1 and pb | count > 1 and pa[1] == pb[1]
                  else la ~ '–' ~ lb -}}
            {%- endmacro -%}
            {%- macro hours_for(date) -%}
              {%- set ns = namespace(out=[]) -%}
              {%- for f in all_hours -%}
                {%- set t = as_datetime(f.datetime) | as_local -%}
                {%- if t.date() | string == date and 7 <= t.hour < 22 -%}
                  {%- set ns.out = ns.out + [{
                    'h': t.hour,
                    'temperature': f.temperature,
                    'pop': f.precipitation_probability | default(0, true),
                    'condition': f.condition,
                  }] -%}
                {%- endif -%}
              {%- endfor -%}
              {{- ns.out | tojson -}}
            {%- endmacro -%}
            {%- macro ol(hrs, day) -%}
              {%- set rank = {'exceptional': 100, 'lightning-rainy': 90, 'lightning': 85,
                  'hail': 80, 'snowy-rainy': 75, 'snowy': 70, 'pouring': 65, 'rainy': 60,
                  'fog': 50, 'windy-variant': 45, 'windy': 40, 'cloudy': 30,
                  'partlycloudy': 20, 'sunny': 10, 'clear-night': 10} -%}
              {%- set wetc = ['rainy', 'pouring', 'lightning-rainy', 'lightning', 'snowy',
                  'snowy-rainy', 'hail', 'exceptional'] -%}
              {%- if hrs | count == 0 -%}
                {{ {'texts': [names.get(day.condition, day.condition)], 'icon': icons.get(day.condition, 'mdi:weather-cloudy'), 'wear': none, 'wear_icon': none} | tojson }}
              {%- else -%}
                {%- set conds = hrs | map(attribute='condition') | list -%}
                {%- set ns = namespace(worst=conds[0], spans=[], dry=[], usual=none, best=0) -%}
                {#- Most common condition, wet ones read as cloudy: for a dry day a
                    better summary than the single worst hour (NWS tags
                    slight-chance hours as rainy). -#}
                {%- for c in conds -%}
                  {%- if rank.get(c, 0) > rank.get(ns.worst, 0) %}{% set ns.worst = c %}{% endif -%}
                  {%- set ns.dry = ns.dry + ['cloudy' if c in wetc else c] -%}
                {%- endfor -%}
                {%- for k in ns.dry | unique -%}
                  {%- set n = ns.dry | select('eq', k) | list | count -%}
                  {%- if n > ns.best %}{% set ns.best = n %}{% set ns.usual = k %}{% endif -%}
                {%- endfor -%}
                {%- set usual = ns.usual -%}
                {#- Rain spans: consecutive wet hours, bridging single dry hours. -#}
                {%- set wet = hrs | selectattr('pop', '>=', 50) | list -%}
                {%- for f in wet -%}
                  {%- if ns.spans and f.h - ns.spans[-1][1] <= 1 -%}
                    {%- set ns.spans = ns.spans[:-1] + [[ns.spans[-1][0], f.h + 1]] -%}
                  {%- else -%}
                    {%- set ns.spans = ns.spans + [[f.h, f.h + 1]] -%}
                  {%- endif -%}
                {%- endfor -%}
                {%- set first = hrs[0].h %}{% set last = hrs[-1].h + 1 -%}
                {%- set pops = hrs | map(attribute='pop') | list %}{% set maxpop = pops | max -%}
                {%- if ns.spans -%}
                  {%- set kind = 'Snow' if 'snowy' in conds
                      else 'Sleet' if 'snowy-rainy' in conds or 'hail' in conds
                      else 'Storms' if conds | select('match', 'lightning') | list
                      else 'Rain' -%}
                  {%- set ts = namespace(full=[], terse=[]) -%}
                  {%- for sp in ns.spans[:2] -%}
                    {%- set lead = loop.first -%}
                    {%- for terse in [false, true] -%}
                      {%- set w = kind ~ ' ' if lead else '' if terse else 'again ' -%}
                      {%- if sp[0] <= first and sp[1] >= last -%}
                        {%- set d = kind ~ ' all day' if lead else '' -%}
                      {%- elif sp[0] <= first -%}
                        {%- set d = w ~ ('till ' if terse else 'until ') ~ hl(sp[1]) -%}
                      {%- elif sp[1] >= last -%}
                        {%- set d = w ~ 'from ' ~ hl(sp[0]) -%}
                      {%- else -%}
                        {%- set d = w ~ hr(sp[0], sp[1]) -%}
                      {%- endif -%}
                      {%- if d and terse %}{% set ts.terse = ts.terse + [d] %}{% elif d %}{% set ts.full = ts.full + [d] %}{% endif -%}
                    {%- endfor -%}
                  {%- endfor -%}
                  {%- set more = ', …' if ns.spans | count > 2 else '' -%}
                  {%- set full = ts.full | join(', ') ~ more -%}
                  {%- set amount = ' (' ~ (wet | map(attribute='pop') | max | int) ~ '%)' -%}
                  {%- set texts = [full ~ amount, full, ts.terse | join(', ') ~ more] -%}
                  {%- set icon = ns.worst -%}
                {%- else -%}
                  {%- set sky = {'sunny': 'sunny', 'clear-night': 'clear', 'partlycloudy': 'partly cloudy',
                      'cloudy': 'cloudy', 'fog': 'foggy', 'windy': 'windy', 'windy-variant': 'windy'}.get(usual) -%}
                  {%- if maxpop >= 20 -%}
                    {%- set Sky = sky[0] | upper ~ sky[1:] if sky else 'Mostly dry' -%}
                    {%- set peak = hrs | selectattr('pop', '>=', maxpop - 5) | list -%}
                    {%- set ps = peak[0].h %}{% set pe = peak[-1].h + 1 -%}
                    {%- set when = '' -%}
                    {%- if peak | count == pe - ps and pe - ps <= (last - first) / 2 -%}
                      {%- set when = ' until ' ~ hl(pe) if ps <= first
                          else ' from ' ~ hl(ps) if pe >= last
                          else ' ' ~ hr(ps, pe) -%}
                    {%- endif -%}
                    {%- set texts = [Sky ~ ' (' ~ maxpop | int ~ '%' ~ when ~ ')', Sky ~ ' (' ~ maxpop | int ~ '%)'] -%}
                  {%- else -%}
                    {%- set texts = ['Dry, ' ~ sky if sky else 'Dry'] -%}
                  {%- endif -%}
                  {%- set icon = usual -%}
                {%- endif -%}
                {#- Dress for the coldest outdoor hour; flag heat separately. -#}
                {%- set temps = hrs | map(attribute='temperature') | list -%}
                {%- set lo = temps | min %}{% set hi = temps | max -%}
                {%- set wear = 'Heavy coat' if lo < 32 else 'Coat' if lo < 45 else 'Jacket' if lo < 58
                    else 'Light layer' if lo < 68 else 'T-shirt' -%}
                {%- set wicon = 'mdi:snowflake' if lo < 32 else 'mdi:tshirt-crew-outline' -%}
                {%- if hi >= 85 -%}
                  {%- set wear = 'Hot' if wear == 'T-shirt' else wear ~ ', hot' %}{% set wicon = 'mdi:thermometer-high' -%}
                {%- endif -%}
                {%- if ns.spans -%}
                  {%- set snow = 'snowy' in conds or 'snowy-rainy' in conds -%}
                  {%- set wear = ('Boots, ' if snow else 'Umbrella, ') ~ wear | lower -%}
                  {%- set wicon = 'mdi:snowflake' if snow else 'mdi:umbrella-outline' -%}
                {%- endif -%}
                {{ {'texts': texts | unique | list, 'icon': icons.get(icon, 'mdi:weather-cloudy'),
                    'wear': wear, 'wear_icon': wicon} | tojson }}
              {%- endif -%}
            {%- endmacro -%}
            {%- set res = namespace(l=[]) -%}
            {%- for i in range(1) -%}
              {%- set dt = as_datetime(day_date) + timedelta(days=i) -%}
              {%- set d = dt.strftime('%Y-%m-%d') -%}
              {%- set hrs = hours_for(d) | from_json -%}
              {%- set temps = hrs | map(attribute='temperature') | list -%}
              {%- set dp = day if i == 0 else (periods | selectattr('is_daytime')
                  | selectattr('datetime', 'match', d) | list | first
                  | default({'temperature': temps | max if temps else none, 'condition': 'cloudy'}, true)) -%}
              {%- set n = (dt.date() - as_datetime(today_date).date()).days -%}
              {%- set rel = 'Today · ' if n == 0 else 'Tomorrow · ' if n == 1 else '' -%}
              {#- No period and no hours (shouldn't happen live): "–", not an error. -#}
              {%- set his = ([dp.temperature] if dp.temperature is not none else []) + temps -%}
              {%- set hi = his | max if his else none -%}
              {%- set los = temps or his -%}
              {%- set res.l = res.l + [{
                  'date': d,
                  'offset': n,
                  'label': rel ~ dt.strftime('%A, %b %-d'),
                  'label_short': rel ~ dt.strftime('%a, %b %-d' if rel else '%A, %b %-d'),
                  'hi': (hi | round(0) | int) if hi is not none else '–',
                  'lo': (los | min | round(0) | int) if los else '–',
                  'outlook': ol(hrs, dp) | from_json,
                  'exception': excs.get(d, {'missing': false, 'texts': [], 'items': []}),
                  'alerts': alerts_by_day.get(d, []),
              }] -%}
            {%- endfor -%}
            {{ res.l }}
          # 4.2": the five days after the shown day, paired from NWS's
          # day/night periods like the E1001's daily columns (weather.js
          # pairTwiceDaily(): the day's high and condition, that night's low,
          # the higher chance). exception marks an exception day within the
          # visible week (excs).
          strip: >-
            {%- set res = namespace(l=[]) -%}
            {%- for i in range(1, 6) -%}
              {%- set dt = as_datetime(day_date) + timedelta(days=i) -%}
              {%- set d = dt.strftime('%Y-%m-%d') -%}
              {%- set ps = periods | selectattr('datetime', 'match', d) | list -%}
              {%- if ps -%}
                {%- set dp = ps | selectattr('is_daytime') | first | default(none) -%}
                {%- set np = ps | rejectattr('is_daytime') | first | default(none) -%}
                {%- set c = dp.condition if dp else np.condition -%}
                {%- set res.l = res.l + [{
                    'label': dt.strftime('%a %-d'),
                    'icon': icons.get(c, 'mdi:weather-cloudy'),
                    'hi': (dp.temperature | round(0) | int ~ '°') if dp else '–',
                    'lo': (np.temperature | round(0) | int ~ '°') if np else '–',
                    'rain': ps | map(attribute='precipitation_probability') | map('default', 0, true) | max | int,
                    'exception': excs.get(d, {}).get('missing', false),
                }] -%}
              {%- endif -%}
            {%- endfor -%}
            {{ res.l }}
      - variables:
          # The 2.9" shows panels[0].
          day_label: "{{ panels[0].label }}"
          day_offset: "{{ panels[0].offset }}"
          day_hi: "{{ panels[0].hi }}"
          day_lo: "{{ panels[0].lo }}"
          outlook: "{{ panels[0].outlook }}"
          exception: "{{ panels[0].exception }}"
          notices: >-
            {{ ([{'icon': 'mdi:bell-outline', 'text': message}] if message else []) + panels[0].alerts }}
      - variables:
          # The outlook line, fitted the way the E1001 card's _fitText does:
          # the fullest wording plus the what-to-wear hint; else drop the hint;
          # else the first shorter wording that fits; else the tersest one at
          # 80% size. 288 px wide: 16 px bold text, then a 12 px gap, then a
          # 16 px icon, 3 px and 14 px regular text.
          outlook_fit: >-
            {%- macro w(t, tab, size) -%}
              {%- set ns = namespace(n=0) -%}
              {%- for c in t %}{% set ns.n = ns.n + tab.get(c, 0.65) %}{% endfor -%}
              {{- ns.n * size -}}
            {%- endmacro -%}
            {%- set width = 288 -%}
            {%- set texts = outlook.texts -%}
            {%- set wear_w = (12 + 16 + 3 + w(outlook.wear, adv_regular, 14) | float)
                if outlook.wear else none -%}
            {%- if wear_w is not none and w(texts[0], adv_bold, 16) | float + wear_w <= width -%}
              {{ {'text': texts[0], 'size': 16, 'wear': true,
                  'wear_ix': (292 - w(outlook.wear, adv_regular, 14) | float - 19) | round(0) | int} }}
            {%- else -%}
              {%- set ns = namespace(t=none) -%}
              {%- for t in texts -%}
                {%- if ns.t is none and w(t, adv_bold, 16) | float <= width %}{% set ns.t = t %}{% endif -%}
              {%- endfor -%}
              {{ {'text': ns.t or texts | last, 'size': 16 if ns.t else 13, 'wear': false} }}
            {%- endif -%}
          # High and low, each after an arrow glyph, on one baseline (y 76).
          # Two-character temperatures get 56/52 px; a wider one ("100°",
          # "-12°") drops both a size so the pair still fits. The low follows
          # the high's measured width; the 30 px arrows are centred on the
          # digits (their tops sit 0.79 em above the baseline) and overlap the
          # gaps by their glyph padding.
          nums: >-
            {%- set hi = day_hi ~ '°' %}{% set lo = day_lo ~ '°' -%}
            {%- set big = hi | length <= 3 and lo | length <= 3 -%}
            {%- set hs = 56 if big else 46 %}{% set ls = 52 if big else 44 -%}
            {%- set ns = namespace(w=0) -%}
            {%- for c in hi %}{% set ns.w = ns.w + adv_bold.get(c, 0.65) %}{% endfor -%}
            {%- set lo_arrow = 86 + (ns.w * hs) | round(0) | int + 6 -%}
            {{ {'hi': hi, 'lo': lo, 'hi_size': hs, 'lo_size': ls,
                'hi_arrow_y': (76 - 0.79 * hs / 2 - 15) | round(0) | int,
                'lo_arrow_y': (76 - 0.79 * ls / 2 - 15) | round(0) | int,
                'lo_arrow_x': lo_arrow, 'lo_x': lo_arrow + 26} }}
          # The footer line, in priority order: the exception (red), the
          # notices, then the current conditions. Each takes its fullest
          # wording that still fits beside what is already in; what doesn't
          # fit is left out. The "as of" stamp keeps the right end unless an
          # exception needs the whole line. 12 px text, 14 px icons, 8 px gaps.
          footer: >-
            {%- macro w(t, tab, size) -%}
              {%- set ns = namespace(n=0) -%}
              {%- for c in t %}{% set ns.n = ns.n + tab.get(c, 0.65) %}{% endfor -%}
              {{- ns.n * size -}}
            {%- endmacro -%}
            {%- set cands = namespace(l=[]) -%}
            {%- if exception.missing -%}
              {%- set cands.l = [{'icon': 'mdi:alert-circle', 'texts': exception.texts, 'bold': true, 'color': 'red', 'must': true}] -%}
            {%- endif -%}
            {%- for n in notices -%}
              {%- set cands.l = cands.l + [{'icon': n.icon, 'texts': [n.text], 'bold': false, 'color': 'black', 'must': false}] -%}
            {%- endfor -%}
            {%- set cands.l = cands.l + [{'icon': now_icon,
                'texts': ['Now ' ~ now_temp ~ '° · ' ~ now_name, 'Now ' ~ now_temp ~ '°'],
                'bold': false, 'color': 'black', 'must': false}] -%}
            {%- set stamp_w = w('as of ' ~ stamp, adv_regular, 11) | float -%}
            {%- set ns = namespace(parts=[], used=0, avail=288 - stamp_w - 8, show_stamp=true) -%}
            {%- for c in cands.l -%}
              {%- set pick = namespace(t=none, w=0) -%}
              {%- for t in c.texts -%}
                {%- set iw = 16 + w(t, adv_bold if c.bold else adv_regular, 12) | float + (8 if ns.parts else 0) -%}
                {%- if pick.t is none and ns.used + iw <= ns.avail %}{% set pick.t = t %}{% set pick.w = iw %}{% endif -%}
              {%- endfor -%}
              {%- if pick.t is none and c.must -%}
                {#- The exception always shows: give it the stamp's room too. -#}
                {%- set ns.show_stamp = false -%}
                {%- set pick.t = c.texts | last %}{% set pick.w = 16 + w(pick.t, adv_bold, 12) | float -%}
              {%- endif -%}
              {%- if pick.t is not none -%}
                {%- set x = (4 + ns.used + (8 if ns.parts else 0)) | round(0) | int -%}
                {%- set ns.parts = ns.parts + [{'icon': c.icon, 'text': pick.t, 'color': c.color, 'ix': x, 'tx': x + 16,
                    'font': 'fonts/NotoSansKR-Bold.ttf' if c.bold else 'fonts/NotoSansKR-Regular.ttf'}] -%}
                {%- set ns.used = ns.used + pick.w -%}
              {%- endif -%}
            {%- endfor -%}
            {{ {'parts': ns.parts, 'n': ns.parts | count, 'stamp': ns.show_stamp} }}
      - variables:
          # 4.2" top (392 px of text): the outlook line like the 2.9"'s
          # outlook_fit, larger (18 px bold, hint 16 px), the high/low
          # positions like nums, and a note line about the kids' day: the
          # exception in red at its fullest wording that fits, or on other
          # days their schedule (excs items).
          top42: >-
            {%- macro w(t, tab, size) -%}
              {%- set ns = namespace(n=0) -%}
              {%- for c in t %}{% set ns.n = ns.n + tab.get(c, 0.65) %}{% endfor -%}
              {{- ns.n * size -}}
            {%- endmacro -%}
            {%- set p = panels[0] -%}
            {%- set width = 392 -%}
            {%- set texts = p.outlook.texts -%}
            {%- set ol = namespace(t=none, size=18, wear=false, wear_ix=0) -%}
            {%- set wear_w = (14 + 18 + 3 + w(p.outlook.wear, adv_regular, 16) | float) if p.outlook.wear else none -%}
            {%- if wear_w is not none and w(texts[0], adv_bold, 18) | float + wear_w <= width -%}
              {%- set ol.t = texts[0] %}{% set ol.wear = true -%}
              {%- set ol.wear_ix = (396 - w(p.outlook.wear, adv_regular, 16) | float - 21) | round(0) | int -%}
            {%- else -%}
              {%- for t in texts -%}
                {%- if ol.t is none and w(t, adv_bold, 18) | float <= width %}{% set ol.t = t %}{% endif -%}
              {%- endfor -%}
              {%- if ol.t is none %}{% set ol.t = texts | last %}{% set ol.size = 15 %}{% endif -%}
            {%- endif -%}
            {%- set hi = p.hi ~ '°' %}{% set lo = p.lo ~ '°' -%}
            {%- set big = hi | length <= 3 and lo | length <= 3 -%}
            {%- set hs = 62 if big else 52 %}{% set ls = 54 if big else 46 -%}
            {%- set lo_arrow = 112 + w(hi, adv_bold, hs) | float | round(0) | int + 14 -%}
            {%- set note = namespace(parts=[], used=0) -%}
            {%- if p.exception.missing -%}
              {%- set pick = namespace(t=p.exception.texts | last) -%}
              {%- for t in p.exception.texts | reverse -%}
                {%- if 18 + w(t, adv_bold, 14) | float <= width %}{% set pick.t = t %}{% endif -%}
              {%- endfor -%}
              {%- set note.parts = [{'icon': 'mdi:alert-circle', 'text': pick.t, 'color': 'red', 'ix': 4, 'tx': 22, 'font': 'fonts/NotoSansKR-Bold.ttf'}] -%}
              {%- set note.used = 18 + w(pick.t, adv_bold, 14) | float -%}
            {%- endif -%}
            {#- No exception: the kids' schedule for the day (action times and
                anything outside the routine): in full, else without AM/PM,
                else the items that fit and "…". -#}
            {%- if not p.exception.missing and p.exception['items'] -%}
              {%- set budget = width - 18 -%}
              {%- set full = p.exception['items'] | join(' · ') -%}
              {%- set short = full | regex_replace(' [AP]M', '') -%}
              {%- set sc = namespace(t='', all=true) -%}
              {%- if w(full, adv_regular, 14) | float <= budget -%}
                {%- set sc.t = full -%}
              {%- elif w(short, adv_regular, 14) | float <= budget -%}
                {%- set sc.t = short -%}
              {%- else -%}
                {%- for t in p.exception['items'] | map('regex_replace', ' [AP]M', '') -%}
                  {%- set cand = sc.t ~ (' · ' if sc.t else '') ~ t -%}
                  {%- if sc.all and w(cand ~ ' …', adv_regular, 14) | float <= budget %}{% set sc.t = cand %}{% else %}{% set sc.all = false %}{% endif -%}
                {%- endfor -%}
                {%- set sc.t = sc.t ~ ' …' if sc.t else '' -%}
              {%- endif -%}
              {%- if sc.t -%}
                {%- set note.parts = [{'icon': 'mdi:calendar-clock', 'text': sc.t, 'color': 'black', 'ix': 4, 'tx': 22, 'font': 'fonts/NotoSansKR-Regular.ttf'}] -%}
              {%- endif -%}
            {%- endif -%}
            {{ {'banner': 'red' if p.exception.missing else 'yellow' if p.offset == 1 else 'white',
                'ink': 'white' if p.exception.missing else 'black',
                'outlook': ol.t, 'outlook_size': ol.size, 'wear': ol.wear, 'wear_ix': ol.wear_ix,
                'hi': hi, 'lo': lo, 'hi_size': hs, 'lo_size': ls,
                'hi_arrow_y': (88 - 0.79 * hs / 2 - 17) | round(0) | int,
                'lo_arrow_y': (88 - 0.79 * ls / 2 - 17) | round(0) | int,
                'lo_arrow_x': lo_arrow, 'lo_x': lo_arrow + 30,
                'note': note.parts, 'n': note.parts | count} }}
          # 4.2" footer (392 px), like the 2.9"'s: the notices (banner message,
          # the shown day's calendar alerts), then the current conditions at
          # their fullest wording that fits, with x positions for one
          # baseline, and the stamp at the right. 13 px text, 15 px icons.
          footer42: >-
            {%- macro w(t, tab, size) -%}
              {%- set ns = namespace(n=0) -%}
              {%- for c in t %}{% set ns.n = ns.n + tab.get(c, 0.65) %}{% endfor -%}
              {{- ns.n * size -}}
            {%- endmacro -%}
            {%- set cands = namespace(l=[]) -%}
            {%- if message %}{% set cands.l = [{'icon': 'mdi:bell-outline', 'texts': [message], 'bold': true}] %}{% endif -%}
            {%- for a in panels[0].alerts -%}
              {%- set cands.l = cands.l + [{'icon': a.icon, 'texts': [a.text], 'bold': false}] -%}
            {%- endfor -%}
            {%- set cands.l = cands.l + [{'icon': now_icon, 'bold': false, 'texts': [
                'Now ' ~ now_temp ~ '° · ' ~ now_name ~ ' · Humidity ' ~ humidity ~ '% · Wind ' ~ wind,
                'Now ' ~ now_temp ~ '° · ' ~ now_name ~ ' · ' ~ humidity ~ '% · ' ~ wind,
                'Now ' ~ now_temp ~ '° · ' ~ now_name, 'Now ' ~ now_temp ~ '°']}] -%}
            {%- set ns = namespace(parts=[], used=0, avail=392 - w('as of ' ~ stamp, adv_regular, 12) | float - 10) -%}
            {%- for c in cands.l -%}
              {%- set pick = namespace(t=none, w=0) -%}
              {%- for t in c.texts -%}
                {%- set iw = 17 + w(t, adv_bold if c.bold else adv_regular, 13) | float + (10 if ns.parts else 0) -%}
                {%- if pick.t is none and ns.used + iw <= ns.avail %}{% set pick.t = t %}{% set pick.w = iw %}{% endif -%}
              {%- endfor -%}
              {%- if pick.t is not none -%}
                {%- set x = (4 + ns.used + (10 if ns.parts else 0)) | round(0) | int -%}
                {%- set ns.parts = ns.parts + [{'icon': c.icon, 'text': pick.t, 'ix': x, 'tx': x + 17,
                    'font': 'fonts/NotoSansKR-Bold.ttf' if c.bold else 'fonts/NotoSansKR-Regular.ttf'}] -%}
                {%- set ns.used = ns.used + pick.w -%}
              {%- endif -%}
            {%- endfor -%}
            {{ {'parts': ns.parts, 'n': ns.parts | count} }}
      - action: ble_esl.write_guarded
        continue_on_error: true
        target:
          entity_id: image.esl_420_last_updated_content
        data:
          dry_run: "{{ dry }}"
          background: white
          payload:
            # The 2.9"'s day across the full width, with the 2.9"'s rules:
            # banner (date; plain today, yellow tomorrow, red on an exception
            # day), icon and ▲high ▼low, the outlook with what to wear, and the
            # exception and calendar alerts. Then the five days after it, and a
            # footer with the banner message and current conditions.
            - type: rectangle
              x_start: 0
              y_start: 0
              x_end: 399
              y_end: 25
              fill: "{{ top42.banner }}"
            - type: line
              x_start: 0
              y_start: 25
              x_end: 399
              y_end: 25
              fill: black
              width: 1
            - type: text
              value: "{{ panels[0].label }}"
              x: 200
              "y": 13
              size: 17
              color: "{{ top42.ink }}"
              anchor: mm
              font: fonts/NotoSansKR-Bold.ttf
            - type: icon
              value: "{{ panels[0].outlook.icon }}"
              x: 6
              "y": 30
              size: 72
              color: black
            - type: icon
              value: mdi:arrow-up-bold
              x: 82
              "y": "{{ top42.hi_arrow_y }}"
              size: 34
              color: red
            - type: text
              value: "{{ top42.hi }}"
              x: 112
              "y": 88
              size: "{{ top42.hi_size }}"
              color: red
              anchor: ls
              font: fonts/NotoSansKR-Bold.ttf
            - type: icon
              value: mdi:arrow-down-bold
              x: "{{ top42.lo_arrow_x }}"
              "y": "{{ top42.lo_arrow_y }}"
              size: 34
              color: black
            - type: text
              value: "{{ top42.lo }}"
              x: "{{ top42.lo_x }}"
              "y": 88
              size: "{{ top42.lo_size }}"
              color: black
              anchor: ls
              font: fonts/NotoSansKR-Bold.ttf
            # Outlook, with what to wear right-aligned when it fits; one baseline.
            - type: text
              value: "{{ top42.outlook }}"
              x: 4
              "y": 119
              size: "{{ top42.outlook_size }}"
              color: black
              anchor: ls
              font: fonts/NotoSansKR-Bold.ttf
            - type: icon
              value: "{{ panels[0].outlook.wear_icon or 'mdi:tshirt-crew-outline' }}"
              x: "{{ top42.wear_ix }}"
              "y": 104
              size: 18
              color: black
              visible: "{{ top42.wear }}"
            - type: text
              value: "{{ panels[0].outlook.wear or '' }}"
              x: 396
              "y": 119
              size: 16
              color: black
              anchor: rs
              font: fonts/NotoSansKR-Regular.ttf
              visible: "{{ top42.wear }}"
            # The exception (red) and calendar alerts, one baseline.
            - type: icon
              value: "{{ top42.note[0].icon if top42.n > 0 else 'mdi:circle-small' }}"
              x: "{{ top42.note[0].ix if top42.n > 0 else 0 }}"
              "y": 130
              size: 16
              color: "{{ top42.note[0].color if top42.n > 0 else 'black' }}"
              visible: "{{ top42.n > 0 }}"
            - type: text
              value: "{{ top42.note[0].text if top42.n > 0 else '' }}"
              x: "{{ top42.note[0].tx if top42.n > 0 else 0 }}"
              "y": 143
              size: 14
