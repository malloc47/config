# Bluetooth e-paper shelf labels (ble_esl integration; docs/ble-esl.md).
#
# Loaded as the `ble_esl` Home Assistant package (modules/home-automation.nix),
# so it is Nix-owned: not editable from the UI and not part of ha-foldin.
#
#   ESL 4.2" (PSJ-420, 400x300 BWRY)  image.esl_420_*  — weather: now, the next
#                                     four NWS periods, and a 24 h temperature line
#   ESL 2.9" (PSJ-290, 296x128 BWRY)  image.esl_290_*  — kids' room: the day ahead
#                                     (today before noon, tomorrow after), with
#                                     current conditions as a footer
#
# Data is NWS (weather.nws_khpn): twice_daily day/night periods and hourly.
# When NWS is unavailable the run is skipped, so the labels keep the last good
# image rather than showing blanks. Writes are guarded (Prevent Duplicate Send
# is on for both tags), so an unchanged image costs no BLE airtime or battery.
#
# Preview without touching the panels: run script.esl_weather_render with
# dry_run: true, then look at image.esl_420_preview_content /
# image.esl_290_preview_content.
#
# A write that fails after all retries notifies the phone (esl_write_failed),
# which is the signal that a tag has been moved out of range.

script:
  esl_weather_render:
    alias: "ESL: render weather labels"
    description: Render the NWS forecast onto the 4.2" and 2.9" e-paper labels.
    mode: queued
    max: 2
    fields:
      dry_run:
        description: Render the previews only; send nothing to the tags.
        default: false
        # `boolean:` rather than `boolean: {}`: HA's package merge drops
        # empty mappings, which leaves an invalid empty selector.
        selector:
          boolean:
      forecast_day:
        description: >-
          Which day the 2.9" shows. auto = today before noon, tomorrow from
          noon on; today/tomorrow force one, for previewing both layouts.
        default: auto
        selector:
          select:
            options:
              - auto
              - today
              - tomorrow
    sequence:
      - condition: template
        value_template: "{{ states('weather.nws_khpn') not in ['unavailable', 'unknown'] }}"
      - action: weather.get_forecasts
        target:
          entity_id: weather.nws_khpn
        data:
          type: twice_daily
        response_variable: twice_daily
      - action: weather.get_forecasts
        target:
          entity_id: weather.nws_khpn
        data:
          type: hourly
        response_variable: hourly
      - variables:
          dry: "{{ dry_run | default(false) | bool }}"
          periods: "{{ twice_daily['weather.nws_khpn'].forecast }}"
          all_hours: "{{ hourly['weather.nws_khpn'].forecast }}"
          hours: "{{ hourly['weather.nws_khpn'].forecast[:24] }}"
          night: "{{ is_state('sun.sun', 'below_horizon') }}"
          icons:
            clear-night: mdi:weather-night
            cloudy: mdi:weather-cloudy
            exceptional: mdi:alert-circle-outline
            fog: mdi:weather-fog
            hail: mdi:weather-hail
            lightning: mdi:weather-lightning
            lightning-rainy: mdi:weather-lightning-rainy
            partlycloudy: mdi:weather-partly-cloudy
            pouring: mdi:weather-pouring
            rainy: mdi:weather-rainy
            snowy: mdi:weather-snowy
            snowy-rainy: mdi:weather-snowy-rainy
            sunny: mdi:weather-sunny
            windy: mdi:weather-windy
            windy-variant: mdi:weather-windy-variant
          # Advance widths (em) of the bundled NotoSansKR Bold / Regular, measured
          # with PIL, so templates can tell whether a line fits; summing them
          # overestimates kerned text by about a pixel, which errs on the safe side.
          adv_bold: {'a': 0.591, 'b': 0.644, 'c': 0.527, 'd': 0.644, 'e': 0.581, 'f': 0.372, 'g': 0.597, 'h': 0.64, 'i': 0.304, 'j': 0.306, 'k': 0.604, 'l': 0.315, 'm': 0.964, 'n': 0.641, 'o': 0.626, 'p': 0.644, 'q': 0.644, 'r': 0.437, 's': 0.495, 't': 0.421, 'u': 0.637, 'v': 0.576, 'w': 0.863, 'x': 0.562, 'y': 0.574, 'z': 0.511, 'A': 0.641, 'B': 0.681, 'C': 0.656, 'D': 0.714, 'E': 0.615, 'F': 0.585, 'G': 0.717, 'H': 0.757, 'I': 0.33, 'J': 0.568, 'K': 0.686, 'L': 0.578, 'M': 0.853, 'N': 0.749, 'O': 0.77, 'P': 0.667, 'Q': 0.77, 'R': 0.682, 'S': 0.624, 'T': 0.625, 'U': 0.748, 'V': 0.619, 'W': 0.915, 'X': 0.627, 'Y': 0.58, 'Z': 0.613, '0': 0.59, '1': 0.59, '2': 0.59, '3': 0.59, '4': 0.59, '5': 0.59, '6': 0.59, '7': 0.59, '8': 0.59, '9': 0.59, ' ': 0.227, ',': 0.325, '.': 0.325, '(': 0.378, ')': 0.378, '%': 0.963, '–': 0.544, '…': 1.0, '-': 0.37, "'": 0.325, '°': 0.404, ':': 0.325}
          adv_regular: {'a': 0.563, 'b': 0.618, 'c': 0.51, 'd': 0.62, 'e': 0.554, 'f': 0.325, 'g': 0.564, 'h': 0.607, 'i': 0.275, 'j': 0.275, 'k': 0.552, 'l': 0.284, 'm': 0.926, 'n': 0.61, 'o': 0.606, 'p': 0.62, 'q': 0.62, 'r': 0.388, 's': 0.468, 't': 0.377, 'u': 0.607, 'v': 0.521, 'w': 0.802, 'x': 0.498, 'y': 0.521, 'z': 0.475, 'A': 0.608, 'B': 0.657, 'C': 0.638, 'D': 0.688, 'E': 0.589, 'F': 0.552, 'G': 0.689, 'H': 0.728, 'I': 0.293, 'J': 0.535, 'K': 0.646, 'L': 0.543, 'M': 0.812, 'N': 0.723, 'O': 0.742, 'P': 0.633, 'Q': 0.742, 'R': 0.635, 'S': 0.596, 'T': 0.599, 'U': 0.721, 'V': 0.575, 'W': 0.878, 'X': 0.573, 'Y': 0.531, 'Z': 0.603, '0': 0.555, '1': 0.555, '2': 0.555, '3': 0.555, '4': 0.555, '5': 0.555, '6': 0.555, '7': 0.555, '8': 0.555, '9': 0.555, ' ': 0.224, ',': 0.278, '.': 0.278, '(': 0.338, ')': 0.338, '%': 0.921, '–': 0.536, '…': 1.0, '-': 0.347, "'": 0.278, '°': 0.37, ':': 0.278}
          names:
            clear-night: Clear
            cloudy: Cloudy
            exceptional: Alert
            fog: Fog
            hail: Hail
            lightning: Storms
            lightning-rainy: T-storms
            partlycloudy: Partly cloudy
            pouring: Heavy rain
            rainy: Rain
            snowy: Snow
            snowy-rainy: Wintry mix
            sunny: Sunny
            windy: Windy
            windy-variant: Windy
      - condition: template
        value_template: "{{ periods | count >= 4 and hours | count > 0 }}"
      - variables:
          now_temp: "{{ state_attr('weather.nws_khpn', 'temperature') | round(0) | int }}"
          now_cond: "{{ states('weather.nws_khpn') }}"
          # NWS reports the night sky as sunny/partlycloudy too.
          now_icon: >-
            {% set c = states('weather.nws_khpn') %}
            {% if night and c == 'sunny' %}mdi:weather-night
            {% elif night and c == 'partlycloudy' %}mdi:weather-night-partly-cloudy
            {% else %}{{ icons.get(c, 'mdi:weather-cloudy') }}{% endif %}
          now_name: >-
            {% set c = states('weather.nws_khpn') %}
            {{ 'Clear' if night and c == 'sunny' else names.get(c, c) }}
          humidity: "{{ state_attr('weather.nws_khpn', 'humidity') | round(0) | int }}"
          wind: >-
            {% set b = state_attr('weather.nws_khpn', 'wind_bearing') %}
            {% set dirs = ['N','NE','E','SE','S','SW','W','NW'] %}
            {{ state_attr('weather.nws_khpn', 'wind_speed') | round(0) | int }} mph
            {{- ' ' ~ dirs[((b | float(0) + 22.5) // 45) | int % 8] if b is number else '' }}
          stamp: "{{ now().strftime('%-I %p') }}"
          # The next four day/night periods, labelled like NWS does.
          cols: >-
            {% set ns = namespace(out=[]) %}
            {% for p in periods[:4] %}
              {% set d = as_datetime(p.datetime) | as_local %}
              {% if d.date() == now().date() %}
                {% set label = 'Today' if p.is_daytime else 'Tonight' %}
              {% else %}
                {% set label = d.strftime('%a') ~ ('' if p.is_daytime else ' Night') %}
              {% endif %}
              {% set ns.out = ns.out + [{
                'label': label,
                'icon': icons.get(p.condition, 'mdi:weather-cloudy')
                        if p.is_daytime or p.condition not in ['sunny', 'partlycloudy']
                        else ('mdi:weather-night' if p.condition == 'sunny' else 'mdi:weather-night-partly-cloudy'),
                'temp': p.temperature | round(0) | int,
                'color': 'red' if p.is_daytime else 'black',
                'rain': p.precipitation_probability | default(0, true) | int,
              }] %}
            {% endfor %}
            {{ ns.out }}
          temps: "{{ hours | map(attribute='temperature') | map('round', 0) | map('int') | list }}"
          # 2.9": the day to get ready for — today before noon, tomorrow from
          # noon on (the evening look at tomorrow).
          tomorrow: >-
            {% set f = forecast_day | default('auto') %}
            {{ f == 'tomorrow' or (f == 'auto' and now().hour >= 12) }}
      - variables:
          want: "{{ (now() + timedelta(days=1 if tomorrow else 0)).date() | string }}"
      - variables:
          # Falls back to the next daytime period when that day has none left
          # (today, late); everything below follows the period actually picked.
          day: >-
            {{ periods | selectattr('is_daytime') | selectattr('datetime', 'match', want)
               | list | first | default(periods | selectattr('is_daytime') | first, true) }}
      - variables:
          # A string ("2026-11-08"): script variables don't keep date objects.
          day_date: "{{ (as_datetime(day.datetime) | as_local).date() | string }}"
      - variables:
          # The hourly forecast over that day's outdoor hours, 7 AM-10 PM like
          # the E1001 and kitchen cards' outdoor_hours: [7, 22] (for today, what
          # is left of them). Its range and wet hours are what the kids dress
          # and pack for; the overnight lows either side are not.
          waking: >-
            {% set ns = namespace(out=[]) %}
            {% for f in all_hours %}
              {% set t = as_datetime(f.datetime) | as_local %}
              {% if t.date() | string == day_date and 7 <= t.hour < 22 %}
                {% set ns.out = ns.out + [{
                  'h': t.hour,
                  'temperature': f.temperature,
                  'pop': f.precipitation_probability | default(0, true),
                  'condition': f.condition,
                }] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - variables:
          day_label: >-
            {% set d = as_datetime(day_date) %}
            {% set n = (d.date() - now().date()).days %}
            {{ ('Today · ' if n == 0 else 'Tomorrow · ' if n == 1 else '')
               ~ d.strftime('%A') }}
          day_hi: >-
            {{ ([day.temperature] + (waking | map(attribute='temperature') | list))
               | max | round(0) | int }}
          day_lo: >-
            {{ (waking | map(attribute='temperature') | list
                or [day.temperature]) | min | round(0) | int }}
          # The "what to wear" outlook, ported from lovelace-common/weather.js
          # outlookRow() (the E1001 and kitchen cards) with their thresholds:
          # an hour is wet at >= 50% chance, coat below 45 °F, hot from 85 °F.
          # texts runs from most to least detailed; the render picks one that
          # fits. icon is the worst condition when it rains, else the usual one.
          outlook: >-
            {%- macro hl(h) -%}
              {{- 'midnight' if h % 24 == 0 else 'noon' if h % 24 == 12
                  else ((h % 12) or 12) ~ (' AM' if h % 24 < 12 else ' PM') -}}
            {%- endmacro -%}
            {%- macro hr(a, b) -%}
              {%- set la = hl(a) %}{% set lb = hl(b) -%}
              {%- set pa = la.split(' ') %}{% set pb = lb.split(' ') -%}
              {{- pa[0] ~ '–' ~ lb if pa | count > 1 and pb | count > 1 and pa[1] == pb[1]
                  else la ~ '–' ~ lb -}}
            {%- endmacro -%}
            {%- set rank = {'exceptional': 100, 'lightning-rainy': 90, 'lightning': 85,
                'hail': 80, 'snowy-rainy': 75, 'snowy': 70, 'pouring': 65, 'rainy': 60,
                'fog': 50, 'windy-variant': 45, 'windy': 40, 'cloudy': 30,
                'partlycloudy': 20, 'sunny': 10, 'clear-night': 10} -%}
            {%- set wetc = ['rainy', 'pouring', 'lightning-rainy', 'lightning', 'snowy',
                'snowy-rainy', 'hail', 'exceptional'] -%}
            {%- set hrs = waking -%}
            {%- if hrs | count == 0 -%}
              {{ {'texts': [names.get(day.condition, day.condition)], 'icon': icons.get(day.condition, 'mdi:weather-cloudy'), 'wear': none, 'wear_icon': none} }}
            {%- else -%}
              {%- set conds = hrs | map(attribute='condition') | list -%}
              {%- set ns = namespace(worst=conds[0], spans=[], dry=[], usual=none, best=0) -%}
              {#- Most common condition, wet ones read as cloudy: for a dry day a
                  better summary than the single worst hour (NWS tags
                  slight-chance hours as rainy). -#}
              {%- for c in conds -%}
                {%- if rank.get(c, 0) > rank.get(ns.worst, 0) %}{% set ns.worst = c %}{% endif -%}
                {%- set ns.dry = ns.dry + ['cloudy' if c in wetc else c] -%}
              {%- endfor -%}
              {%- for k in ns.dry | unique -%}
                {%- set n = ns.dry | select('eq', k) | list | count -%}
                {%- if n > ns.best %}{% set ns.best = n %}{% set ns.usual = k %}{% endif -%}
              {%- endfor -%}
              {%- set usual = ns.usual -%}
              {#- Rain spans: consecutive wet hours, bridging single dry hours. -#}
              {%- set wet = hrs | selectattr('pop', '>=', 50) | list -%}
              {%- for f in wet -%}
                {%- if ns.spans and f.h - ns.spans[-1][1] <= 1 -%}
                  {%- set ns.spans = ns.spans[:-1] + [[ns.spans[-1][0], f.h + 1]] -%}
                {%- else -%}
                  {%- set ns.spans = ns.spans + [[f.h, f.h + 1]] -%}
                {%- endif -%}
              {%- endfor -%}
              {%- set first = hrs[0].h %}{% set last = hrs[-1].h + 1 -%}
              {%- set pops = hrs | map(attribute='pop') | list %}{% set maxpop = pops | max -%}
              {%- if ns.spans -%}
                {%- set kind = 'Snow' if 'snowy' in conds
                    else 'Sleet' if 'snowy-rainy' in conds or 'hail' in conds
                    else 'Storms' if conds | select('match', 'lightning') | list
                    else 'Rain' -%}
                {%- set ts = namespace(full=[], terse=[]) -%}
                {%- for sp in ns.spans[:2] -%}
                  {%- set lead = loop.first -%}
                  {%- for terse in [false, true] -%}
                    {%- set w = kind ~ ' ' if lead else '' if terse else 'again ' -%}
                    {%- if sp[0] <= first and sp[1] >= last -%}
                      {%- set d = kind ~ ' all day' if lead else '' -%}
                    {%- elif sp[0] <= first -%}
                      {%- set d = w ~ ('till ' if terse else 'until ') ~ hl(sp[1]) -%}
                    {%- elif sp[1] >= last -%}
                      {%- set d = w ~ 'from ' ~ hl(sp[0]) -%}
                    {%- else -%}
                      {%- set d = w ~ hr(sp[0], sp[1]) -%}
                    {%- endif -%}
                    {%- if d and terse %}{% set ts.terse = ts.terse + [d] %}{% elif d %}{% set ts.full = ts.full + [d] %}{% endif -%}
                  {%- endfor -%}
                {%- endfor -%}
                {%- set more = ', …' if ns.spans | count > 2 else '' -%}
                {%- set full = ts.full | join(', ') ~ more -%}
                {%- set amount = ' (' ~ (wet | map(attribute='pop') | max | int) ~ '%)' -%}
                {%- set texts = [full ~ amount, full, ts.terse | join(', ') ~ more] -%}
                {%- set icon = ns.worst -%}
              {%- else -%}
                {%- set sky = {'sunny': 'sunny', 'clear-night': 'clear', 'partlycloudy': 'partly cloudy',
                    'cloudy': 'cloudy', 'fog': 'foggy', 'windy': 'windy', 'windy-variant': 'windy'}.get(usual) -%}
                {%- if maxpop >= 20 -%}
                  {%- set Sky = sky[0] | upper ~ sky[1:] if sky else 'Mostly dry' -%}
                  {%- set peak = hrs | selectattr('pop', '>=', maxpop - 5) | list -%}
                  {%- set ps = peak[0].h %}{% set pe = peak[-1].h + 1 -%}
                  {%- set when = '' -%}
                  {%- if peak | count == pe - ps and pe - ps <= (last - first) / 2 -%}
                    {%- set when = ' until ' ~ hl(pe) if ps <= first
                        else ' from ' ~ hl(ps) if pe >= last
                        else ' ' ~ hr(ps, pe) -%}
                  {%- endif -%}
                  {%- set texts = [Sky ~ ' (' ~ maxpop | int ~ '%' ~ when ~ ')', Sky ~ ' (' ~ maxpop | int ~ '%)'] -%}
                {%- else -%}
                  {%- set texts = ['Dry, ' ~ sky if sky else 'Dry'] -%}
                {%- endif -%}
                {%- set icon = usual -%}
              {%- endif -%}
              {#- Dress for the coldest outdoor hour; flag heat separately. -#}
              {%- set temps = hrs | map(attribute='temperature') | list -%}
              {%- set lo = temps | min %}{% set hi = temps | max -%}
              {%- set wear = 'Heavy coat' if lo < 32 else 'Coat' if lo < 45 else 'Jacket' if lo < 58
                  else 'Light layer' if lo < 68 else 'T-shirt' -%}
              {%- set wicon = 'mdi:snowflake' if lo < 32 else 'mdi:tshirt-crew-outline' -%}
              {%- if hi >= 85 -%}
                {%- set wear = 'Hot' if wear == 'T-shirt' else wear ~ ', hot' %}{% set wicon = 'mdi:thermometer-high' -%}
              {%- endif -%}
              {%- if ns.spans -%}
                {%- set snow = 'snowy' in conds or 'snowy-rainy' in conds -%}
                {%- set wear = ('Boots, ' if snow else 'Umbrella, ') ~ wear | lower -%}
                {%- set wicon = 'mdi:snowflake' if snow else 'mdi:umbrella-outline' -%}
              {%- endif -%}
              {{ {'texts': texts | unique | list, 'icon': icons.get(icon, 'mdi:weather-cloudy'),
                  'wear': wear, 'wear_icon': wicon} }}
            {%- endif -%}
      - variables:
          # The outlook line, fitted the way the E1001 card's _fitText does:
          # the fullest wording plus the what-to-wear hint; else drop the hint;
          # else the first shorter wording that fits; else the tersest one at
          # 80% size. 288 px wide: 16 px bold text, then a 12 px gap, then a
          # 16 px icon, 3 px and 14 px regular text.
          outlook_fit: >-
            {%- macro w(t, tab, size) -%}
              {%- set ns = namespace(n=0) -%}
              {%- for c in t %}{% set ns.n = ns.n + tab.get(c, 0.65) %}{% endfor -%}
              {{- ns.n * size -}}
            {%- endmacro -%}
            {%- set width = 288 -%}
            {%- set texts = outlook.texts -%}
            {%- set wear_w = (12 + 16 + 3 + w(outlook.wear, adv_regular, 14) | float)
                if outlook.wear else none -%}
            {%- if wear_w is not none and w(texts[0], adv_bold, 16) | float + wear_w <= width -%}
              {{ {'text': texts[0], 'size': 16, 'wear': true} }}
            {%- else -%}
              {%- set ns = namespace(t=none) -%}
              {%- for t in texts -%}
                {%- if ns.t is none and w(t, adv_bold, 16) | float <= width %}{% set ns.t = t %}{% endif -%}
              {%- endfor -%}
              {{ {'text': ns.t or texts | last, 'size': 16 if ns.t else 13, 'wear': false} }}
            {%- endif -%}
          # High and low, each after an arrow glyph, on one baseline (y 76).
          # Two-character temperatures get 56/52 px; a wider one ("100°",
          # "-12°") drops both a size so the pair still fits. The low follows
          # the high's measured width; the 30 px arrows are centred on the
          # digits (their tops sit 0.79 em above the baseline) and overlap the
          # gaps by their glyph padding.
          nums: >-
            {%- set hi = day_hi ~ '°' %}{% set lo = day_lo ~ '°' -%}
            {%- set big = hi | length <= 3 and lo | length <= 3 -%}
            {%- set hs = 56 if big else 46 %}{% set ls = 52 if big else 44 -%}
            {%- set ns = namespace(w=0) -%}
            {%- for c in hi %}{% set ns.w = ns.w + adv_bold.get(c, 0.65) %}{% endfor -%}
            {%- set lo_arrow = 86 + (ns.w * hs) | round(0) | int + 6 -%}
            {{ {'hi': hi, 'lo': lo, 'hi_size': hs, 'lo_size': ls,
                'hi_arrow_y': (76 - 0.79 * hs / 2 - 15) | round(0) | int,
                'lo_arrow_y': (76 - 0.79 * ls / 2 - 15) | round(0) | int,
                'lo_arrow_x': lo_arrow, 'lo_x': lo_arrow + 26} }}
      - action: ble_esl.write_guarded
        continue_on_error: true
        target:
          entity_id: image.esl_420_last_updated_content
        data:
          dry_run: "{{ dry }}"
          background: white
          payload:
            # Header band
            - type: rectangle
              x_start: 0
              y_start: 0
              x_end: 399
              y_end: 29
              fill: black
            - type: text
              value: "{{ now().strftime('%A, %B %-d') }}"
              x: 10
              "y": 15
              size: 18
              color: white
              anchor: lm
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "as of {{ stamp }}"
              x: 390
              "y": 15
              size: 14
              color: white
              anchor: rm
              font: fonts/NotoSansKR-Regular.ttf
            # Now
            - type: icon
              value: "{{ now_icon }}"
              x: 10
              "y": 38
              size: 84
              color: black
            - type: text
              value: "{{ now_temp }}°"
              x: 104
              "y": 80
              size: 72
              color: black
              anchor: lm
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "{{ now_name }}"
              x: 250
              "y": 46
              size: 20
              color: black
              anchor: lm
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "Humidity {{ humidity }}%"
              x: 250
              "y": 78
              size: 15
              color: black
              anchor: lm
              font: fonts/NotoSansKR-Regular.ttf
            - type: text
              value: "Wind {{ wind }}"
              x: 250
              "y": 102
              size: 15
              color: black
              anchor: lm
              font: fonts/NotoSansKR-Regular.ttf
            - type: line
              x_start: 0
              y_start: 132
              x_end: 399
              y_end: 132
              fill: black
              width: 2
            # Next four periods, one 100 px column each
            - type: text
              value: "{{ cols[0].label }}"
              x: 50
              "y": 140
              size: 15
              color: black
              anchor: mt
              font: fonts/NotoSansKR-Bold.ttf
            - type: icon
              value: "{{ cols[0].icon }}"
              x: 30
              "y": 160
              size: 40
              color: black
            - type: text
              value: "{{ cols[0].temp }}°"
              x: 50
              "y": 204
              size: 24
              color: "{{ cols[0].color }}"
              anchor: mt
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "{{ cols[0].rain }}%"
              x: 50
              "y": 234
              size: 14
              color: black
              anchor: mt
