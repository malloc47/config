            # (arrow glyphs, one baseline; anchor ls, so glyph tops can't climb
            # into the banner); then the outlook (which carries the chance of
            # rain) and what to wear.
            # Banner: red on an exception day (closures, half-days; the footer
            # says which), else yellow for tomorrow and plain for today.
