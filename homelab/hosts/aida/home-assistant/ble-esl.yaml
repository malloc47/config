            # Outlook (rain timing or sky), with what to wear at the right
            # end of the same line when it fits (outlook_fit).
            - type: stack
              x: 4
              "y": 84
              width: 288
              # Without a height the box is the whole canvas and align: center
              # drops the line off the bottom.
              height: 22
              direction: horizontal
              justify: between
              align: center
              elements:
                - type: text
                  value: "{{ outlook_fit.text }}"
                  size: "{{ outlook_fit.size }}"
                  color: black
                  font: fonts/NotoSansKR-Bold.ttf
                - type: row
                  gap: 3
                  align: center
                  visible: "{{ outlook_fit.wear }}"
                  elements:
                    - type: icon
                      value: "{{ outlook.wear_icon }}"
                      size: 16
                      color: black
                    - type: text
                      value: "{{ outlook.wear }}"
                      size: 14
                      color: black
                      font: fonts/NotoSansKR-Regular.ttf
            # Footer: right now
            - type: line
              x_start: 0
              y_start: 114
              x_end: 295
              y_end: 114
              fill: black
              width: 1
            - type: icon
