# Bluetooth e-paper shelf labels (ble_esl integration; docs/ble-esl.md).
#
# Loaded as the `ble_esl` Home Assistant package (modules/home-automation.nix),
# so it is Nix-owned: not editable from the UI and not part of ha-foldin.
#
#   ESL 4.2" (PSJ-420, 400x300 BWRY)  image.esl_420_*  — weather: now, the next
#                                     four NWS periods, and a 24 h temperature line
#   ESL 2.9" (PSJ-290, 296x128 BWRY)  image.esl_290_*  — kids' room: the day ahead
#                                     (today before noon, tomorrow after), with
#                                     current conditions as a footer
#
# Data is NWS (weather.nws_khpn): twice_daily day/night periods and hourly.
# When NWS is unavailable the run is skipped, so the labels keep the last good
# image rather than showing blanks. Writes are guarded (Prevent Duplicate Send
# is on for both tags), so an unchanged image costs no BLE airtime or battery.
#
# Preview without touching the panels: run script.esl_weather_render with
# dry_run: true, then look at image.esl_420_preview_content /
# image.esl_290_preview_content.
#
# A write that fails after all retries notifies the phone (esl_write_failed),
# which is the signal that a tag has been moved out of range.

script:
  esl_weather_render:
    alias: "ESL: render weather labels"
    description: Render the NWS forecast onto the 4.2" and 2.9" e-paper labels.
    mode: queued
    max: 2
    fields:
      dry_run:
        description: Render the previews only; send nothing to the tags.
        default: false
        # `boolean:` rather than `boolean: {}`: HA's package merge drops
        # empty mappings, which leaves an invalid empty selector.
        selector:
          boolean:
      forecast_day:
        description: >-
          Which day the 2.9" shows. auto = today before noon, tomorrow from
          noon on; today/tomorrow force one, for previewing both layouts.
        default: auto
        selector:
          select:
            options:
              - auto
              - today
              - tomorrow
    sequence:
      - condition: template
        value_template: "{{ states('weather.nws_khpn') not in ['unavailable', 'unknown'] }}"
      - action: weather.get_forecasts
        target:
          entity_id: weather.nws_khpn
        data:
          type: twice_daily
        response_variable: twice_daily
      - action: weather.get_forecasts
        target:
          entity_id: weather.nws_khpn
        data:
          type: hourly
        response_variable: hourly
      - variables:
          dry: "{{ dry_run | default(false) | bool }}"
          periods: "{{ twice_daily['weather.nws_khpn'].forecast }}"
          all_hours: "{{ hourly['weather.nws_khpn'].forecast }}"
          hours: "{{ hourly['weather.nws_khpn'].forecast[:24] }}"
          night: "{{ is_state('sun.sun', 'below_horizon') }}"
          icons:
            clear-night: mdi:weather-night
            cloudy: mdi:weather-cloudy
            exceptional: mdi:alert-circle-outline
            fog: mdi:weather-fog
            hail: mdi:weather-hail
            lightning: mdi:weather-lightning
            lightning-rainy: mdi:weather-lightning-rainy
            partlycloudy: mdi:weather-partly-cloudy
            pouring: mdi:weather-pouring
            rainy: mdi:weather-rainy
            snowy: mdi:weather-snowy
            snowy-rainy: mdi:weather-snowy-rainy
            sunny: mdi:weather-sunny
            windy: mdi:weather-windy
            windy-variant: mdi:weather-windy-variant
          names:
            clear-night: Clear
            cloudy: Cloudy
            exceptional: Alert
            fog: Fog
            hail: Hail
            lightning: Storms
            lightning-rainy: T-storms
            partlycloudy: Partly cloudy
            pouring: Heavy rain
            rainy: Rain
            snowy: Snow
            snowy-rainy: Wintry mix
            sunny: Sunny
            windy: Windy
            windy-variant: Windy
      - condition: template
        value_template: "{{ periods | count >= 4 and hours | count > 0 }}"
      - variables:
          now_temp: "{{ state_attr('weather.nws_khpn', 'temperature') | round(0) | int }}"
          now_cond: "{{ states('weather.nws_khpn') }}"
          # NWS reports the night sky as sunny/partlycloudy too.
          now_icon: >-
            {% set c = states('weather.nws_khpn') %}
            {% if night and c == 'sunny' %}mdi:weather-night
            {% elif night and c == 'partlycloudy' %}mdi:weather-night-partly-cloudy
            {% else %}{{ icons.get(c, 'mdi:weather-cloudy') }}{% endif %}
          now_name: >-
            {% set c = states('weather.nws_khpn') %}
            {{ 'Clear' if night and c == 'sunny' else names.get(c, c) }}
          humidity: "{{ state_attr('weather.nws_khpn', 'humidity') | round(0) | int }}"
          wind: >-
            {% set b = state_attr('weather.nws_khpn', 'wind_bearing') %}
            {% set dirs = ['N','NE','E','SE','S','SW','W','NW'] %}
            {{ state_attr('weather.nws_khpn', 'wind_speed') | round(0) | int }} mph
            {{- ' ' ~ dirs[((b | float(0) + 22.5) // 45) | int % 8] if b is number else '' }}
          stamp: "{{ now().strftime('%-I %p') }}"
          # The next four day/night periods, labelled like NWS does.
          cols: >-
            {% set ns = namespace(out=[]) %}
            {% for p in periods[:4] %}
              {% set d = as_datetime(p.datetime) | as_local %}
              {% if d.date() == now().date() %}
                {% set label = 'Today' if p.is_daytime else 'Tonight' %}
              {% else %}
                {% set label = d.strftime('%a') ~ ('' if p.is_daytime else ' Night') %}
              {% endif %}
              {% set ns.out = ns.out + [{
                'label': label,
                'icon': icons.get(p.condition, 'mdi:weather-cloudy')
                        if p.is_daytime or p.condition not in ['sunny', 'partlycloudy']
                        else ('mdi:weather-night' if p.condition == 'sunny' else 'mdi:weather-night-partly-cloudy'),
                'temp': p.temperature | round(0) | int,
                'color': 'red' if p.is_daytime else 'black',
                'rain': p.precipitation_probability | default(0, true) | int,
              }] %}
            {% endfor %}
            {{ ns.out }}
          temps: "{{ hours | map(attribute='temperature') | map('round', 0) | map('int') | list }}"
          # 2.9": the day to get ready for — today before noon, tomorrow from
          # noon on (the evening look at tomorrow).
          tomorrow: >-
            {% set f = forecast_day | default('auto') %}
            {{ f == 'tomorrow' or (f == 'auto' and now().hour >= 12) }}
      - variables:
          want: "{{ (now() + timedelta(days=1 if tomorrow else 0)).date() | string }}"
      - variables:
          # Falls back to the next daytime period when that day has none left
          # (today, late); everything below follows the period actually picked.
          day: >-
            {{ periods | selectattr('is_daytime') | selectattr('datetime', 'match', want)
               | list | first | default(periods | selectattr('is_daytime') | first, true) }}
      - variables:
          # A string ("2026-11-08"): script variables don't keep date objects.
          day_date: "{{ (as_datetime(day.datetime) | as_local).date() | string }}"
      - variables:
          # The hourly forecast over that day's waking hours (7 AM-8 PM; for
          # today, what is left of them): its range and wettest hour are what
          # the kids dress and pack for. The overnight lows on either side are not.
          waking: >-
            {% set ns = namespace(out=[]) %}
            {% for h in all_hours %}
              {% set t = as_datetime(h.datetime) | as_local %}
              {% if t.date() | string == day_date and 7 <= t.hour <= 20 %}
                {% set ns.out = ns.out + [h] %}
              {% endif %}
            {% endfor %}
            {{ ns.out }}
      - variables:
          day_label: >-
            {% set d = as_datetime(day_date) %}
            {% set n = (d.date() - now().date()).days %}
            {{ ('Today · ' if n == 0 else 'Tomorrow · ' if n == 1 else '')
               ~ d.strftime('%A') }}
          day_icon: "{{ icons.get(day.condition, 'mdi:weather-cloudy') }}"
          day_name: "{{ names.get(day.condition, day.condition) }}"
          day_hi: >-
            {{ ([day.temperature] + (waking | map(attribute='temperature') | list))
               | max | round(0) | int }}
          day_lo: >-
            {{ (waking | map(attribute='temperature') | list
                or [day.temperature]) | min | round(0) | int }}
          day_rain: >-
            {{ (waking | map(attribute='precipitation_probability') | map('default', 0, true) | list
                or [day.precipitation_probability | default(0, true)]) | max | int }}
      - action: ble_esl.write_guarded
        continue_on_error: true
        target:
          entity_id: image.esl_420_last_updated_content
        data:
          dry_run: "{{ dry }}"
          background: white
          payload:
            # Header band
            - type: rectangle
              x_start: 0
              y_start: 0
              x_end: 399
              y_end: 29
              fill: black
            - type: text
              value: "{{ now().strftime('%A, %B %-d') }}"
              x: 10
              "y": 15
              size: 18
              color: white
              anchor: lm
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "as of {{ stamp }}"
              x: 390
              "y": 15
              size: 14
              color: white
              anchor: rm
              font: fonts/NotoSansKR-Regular.ttf
            # Now
            - type: icon
              value: "{{ now_icon }}"
              x: 10
              "y": 38
              size: 84
              color: black
            - type: text
              value: "{{ now_temp }}°"
              x: 104
              "y": 80
              size: 72
              color: black
              anchor: lm
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "{{ now_name }}"
              x: 250
              "y": 46
              size: 20
              color: black
              anchor: lm
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "Humidity {{ humidity }}%"
              x: 250
              "y": 78
              size: 15
              color: black
              anchor: lm
              font: fonts/NotoSansKR-Regular.ttf
            - type: text
              value: "Wind {{ wind }}"
              x: 250
              "y": 102
              size: 15
              color: black
              anchor: lm
              font: fonts/NotoSansKR-Regular.ttf
            - type: line
              x_start: 0
              y_start: 132
              x_end: 399
              y_end: 132
              fill: black
              width: 2
            # Next four periods, one 100 px column each
            - type: text
              value: "{{ cols[0].label }}"
              x: 50
              "y": 140
              size: 15
              color: black
              anchor: mt
              font: fonts/NotoSansKR-Bold.ttf
            - type: icon
              value: "{{ cols[0].icon }}"
              x: 30
              "y": 160
              size: 40
              color: black
            - type: text
              value: "{{ cols[0].temp }}°"
              x: 50
              "y": 204
              size: 24
              color: "{{ cols[0].color }}"
              anchor: mt
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "{{ cols[0].rain }}%"
              x: 50
              "y": 234
              size: 14
              color: black
              anchor: mt
              visible: "{{ cols[0].rain >= 10 }}"
              font: fonts/NotoSansKR-Regular.ttf
            - type: text
              value: "{{ cols[1].label }}"
              x: 150
              "y": 140
              size: 15
              color: black
              anchor: mt
              font: fonts/NotoSansKR-Bold.ttf
            - type: icon
              value: "{{ cols[1].icon }}"
              x: 130
              "y": 160
              size: 40
              color: black
            - type: text
              value: "{{ cols[1].temp }}°"
              x: 150
              "y": 204
              size: 24
              color: "{{ cols[1].color }}"
              anchor: mt
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "{{ cols[1].rain }}%"
              x: 150
              "y": 234
              size: 14
              color: black
              anchor: mt
              visible: "{{ cols[1].rain >= 10 }}"
              font: fonts/NotoSansKR-Regular.ttf
            - type: text
              value: "{{ cols[2].label }}"
              x: 250
              "y": 140
              size: 15
              color: black
              anchor: mt
              font: fonts/NotoSansKR-Bold.ttf
            - type: icon
              value: "{{ cols[2].icon }}"
              x: 230
              "y": 160
              size: 40
              color: black
            - type: text
              value: "{{ cols[2].temp }}°"
              x: 250
              "y": 204
              size: 24
              color: "{{ cols[2].color }}"
              anchor: mt
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "{{ cols[2].rain }}%"
              x: 250
              "y": 234
              size: 14
              color: black
              anchor: mt
              visible: "{{ cols[2].rain >= 10 }}"
              font: fonts/NotoSansKR-Regular.ttf
            - type: text
              value: "{{ cols[3].label }}"
              x: 350
              "y": 140
              size: 15
              color: black
              anchor: mt
              font: fonts/NotoSansKR-Bold.ttf
            - type: icon
              value: "{{ cols[3].icon }}"
              x: 330
              "y": 160
              size: 40
              color: black
            - type: text
              value: "{{ cols[3].temp }}°"
              x: 350
              "y": 204
              size: 24
              color: "{{ cols[3].color }}"
              anchor: mt
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "{{ cols[3].rain }}%"
              x: 350
              "y": 234
              size: 14
              color: black
              anchor: mt
              visible: "{{ cols[3].rain >= 10 }}"
              font: fonts/NotoSansKR-Regular.ttf
            # Next 24 h of temperatures
            - type: line
              x_start: 0
              y_start: 256
              x_end: 399
              y_end: 256
              fill: black
              width: 2
            - type: text
              value: "{{ temps | max }}°"
              x: 8
              "y": 262
              size: 14
              color: red
              anchor: lt
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: "{{ temps | min }}°"
              x: 8
              "y": 296
              size: 14
              color: black
              anchor: lb
              font: fonts/NotoSansKR-Bold.ttf
            - type: sparkline
              x: 44
              "y": 262
              width: 348
              height: 34
              values: "{{ temps | join(',') }}"
              color: red
              fill: yellow
              width_line: 2
              dot_last: false
        response_variable: result_420
      - action: ble_esl.write_guarded
        continue_on_error: true
        target:
          entity_id: image.esl_290_last_updated_content
        data:
          dry_run: "{{ dry }}"
          background: white
          payload:
            # The day ahead: header, then condition, high, low and rain chance
            # as large as fits.
            - type: rectangle
              x_start: 0
              y_start: 0
              x_end: 295
              y_end: 23
              fill: yellow
            - type: text
              value: "{{ day_label }}"
              x: 148
              "y": 12
              size: 16
              color: black
              anchor: mm
              font: fonts/NotoSansKR-Bold.ttf
            - type: icon
              value: "{{ day_icon }}"
              x: 2
              "y": 25
              size: 62
              color: black
            - type: text
              value: "{{ day_hi }}°"
              x: 68
              "y": 22
              size: 44
              color: red
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: high
              x: 72
              "y": 72
              size: 12
              color: black
              font: fonts/NotoSansKR-Regular.ttf
            - type: text
              value: "{{ day_lo }}°"
              x: 150
              "y": 32
              size: 32
              color: black
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: low
              x: 152
              "y": 72
              size: 12
              color: black
              font: fonts/NotoSansKR-Regular.ttf
            - type: icon
              value: mdi:umbrella-outline
              x: 214
              "y": 36
              size: 26
              color: "{{ 'red' if day_rain >= 50 else 'black' }}"
            - type: text
              value: "{{ day_rain }}%"
              x: 242
              "y": 34
              size: 22
              color: "{{ 'red' if day_rain >= 50 else 'black' }}"
              font: fonts/NotoSansKR-Bold.ttf
            - type: text
              value: rain
              x: 244
              "y": 72
              size: 12
              color: black
              font: fonts/NotoSansKR-Regular.ttf
            - type: text
              value: "{{ day_name }}"
              x: 6
              "y": 86
              size: 15
              color: black
              font: fonts/NotoSansKR-Bold.ttf
            # Footer: right now
            - type: line
              x_start: 0
              y_start: 107
              x_end: 295
              y_end: 107
              fill: black
              width: 1
            - type: icon
              value: "{{ now_icon }}"
              x: 4
              "y": 110
              size: 16
              color: black
            - type: text
              value: "Now {{ now_temp }}° · {{ now_name }}"
              x: 24
              "y": 118
              size: 13
              color: black
              anchor: lm
              font: fonts/NotoSansKR-Regular.ttf
            - type: text
              value: "as of {{ stamp }}"
              x: 292
              "y": 118
              size: 11
              color: black
              anchor: rm
              font: fonts/NotoSansKR-Regular.ttf
        response_variable: result_290

automation:
  - id: esl_weather_schedule
    alias: "ESL: refresh weather labels"
    description: >-
      Every three hours from 6 AM to 9 PM. Guarded writes skip a tag whose image
      hasn't changed.
    mode: single
    triggers:
      - trigger: time
        at:
          - "06:00:00"
          - "09:00:00"
          - "12:00:00"
          - "15:00:00"
          - "18:00:00"
          - "21:00:00"
    actions:
      - action: script.esl_weather_render

  # Phone alert when a tag write fails outright. Failure Count only counts
  # writes that failed with every retry used up (Retry Count 3), not attempts
  # a retry rescued. It is in memory and restarts from 0 with HA, so only a
  # real increase (not unavailable -> 0) fires. The message carries the
  # failed write's breakdown from Last Failure Time's attributes: a low rssi
  # or an `unreachable`/`connect` stage means the placement is out of range
  # (move the tag or add a Bluetooth proxy). The tag's notification is
  # replaced by its next failure, not stacked.
  - id: esl_write_failed
    alias: "ESL: notify on failed write"
    mode: queued
    triggers:
      - trigger: state
        entity_id:
          - sensor.esl_420_failure_count
          - sensor.esl_290_failure_count
    conditions:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and trigger.from_state.state | is_number
             and trigger.to_state.state | is_number
             and trigger.to_state.state | int > trigger.from_state.state | int }}
    actions:
      - variables:
          tag: >-
            {{ device_attr(device_id(trigger.entity_id), 'name_by_user')
               or device_attr(device_id(trigger.entity_id), 'name') }}
          last: "{{ trigger.entity_id | replace('failure_count', 'last_failure_time') }}"
          stage: "{{ state_attr(last, 'failed_stage') or 'unknown stage' }}"
          rssi: "{{ state_attr(last, 'rssi') }}"
          attempts: "{{ state_attr(last, 'attempt') }}"
          error: "{{ state_attr(last, 'error') or '' }}"
      - action: notify.mobile_app_motorola_razr_plus_2024
        data:
          title: "E-paper label write failed"
          message: >-
            {{ tag }}: failed at {{ stage }}
            {%- if rssi is number %}, RSSI {{ rssi }} dBm{% endif %}
            {%- if attempts is number %} after {{ attempts }} attempt{{ 's' if attempts != 1 }}{% endif %}.
            {% if error %}{{ error }} {% endif -%}
            ({{ trigger.to_state.state }} failed since HA started.)
          data:
            tag: "{{ trigger.entity_id }}"
            channel: E-paper labels
