# Dashboard for the kitchen's family calendar: an Apolosign 15.6" touchscreen
# (portrait, 1080x1920, laid out at 720x1280 CSS px) running Kiosk Satellite.
# HA dashboards are UI-managed (.storage), so this is the reference copy: the
# dashboard's URL is `dashboard-kitchen` (not admin-only), and this is its raw
# configuration. The tablet's default dashboard
# (select.family_calendar_default_dashboard) is dashboard-kitchen/home.
#
# One panel view holding family-calendar-card
# (pkgs/home-assistant-family-calendar-card), which lays out the whole screen:
# clock and weather outlook on top, the week calendar with a show/hide chip per
# calendar, the kitchen controls (ordinary tiles, under `cards`) and, when
# there are notices, a notification bar along the bottom edge.
title: Kitchen
views:
  - title: Kitchen
    path: home
    panel: true
    cards:
      - type: custom:family-calendar-card
        # Chips in this order, which is also the precedence for hiding
        # duplicate events; colours match each calendar's in Google Calendar
        # (as its dark theme draws them). Each chip's on/off state is
        # remembered on the device. The kids' own calendars (Priscilla is the
        # renamed Kids School, so its entity id is still kids_school) title
        # events without the child's name; the colour says whose they are.
        calendars:
          - entity: calendar.family
            name: Family
            color: "#ca5f77"
          - entity: calendar.kids_school
            name: Priscilla
            color: "#7e508e"
          - entity: calendar.bastian
            name: Bastian
            color: "#668be1"
          - entity: calendar.jarrell
            name: Jarrell
            color: "#d2994f"
          - entity: calendar.charisrebecca_gmail_com
            name: Charis
            color: "#6cae84"
          - entity: calendar.birthdays
            name: Birthdays
            color: "#838bc0"
        # Shorter titles in the narrow day columns (the event popup shows the
        # full title): drop the daycare's and the after-care's names, e.g.
        # "Discovery Village daycare" -> "Daycare", and the school bus's route
        # code, "Bus pickup (JPTH 003 AM)" -> "Bus pickup".
        title_rewrites:
          - match: "Discovery Village "
          - match: "Transfiguration "
          - match: ' \([A-Z]+ \d+ [AP]M\)'
        # A rolling week starting today.
        days: 7
        first_day: today
        # The kids' weekday routine (daycare, bus, kindergarten, after-care,
        # pickup) moves out of the day columns into a "Regular schedule"
        # strip: a row per kid on a shared time axis, with the weekdays where
        # any of it is missing (e.g. early dismissal) at the row's end. An
        # event needs the same calendar, title and times on at least 3 of the
        # visible weekdays. Each kid's calendar has a "Pickup" event; when
        # they're the same (6 PM) it shows once, between the rows, otherwise
        # each row names its own.
        regular_schedule:
          min_days: 3
        # Same sources and outlook settings as the e-ink panel's focus page.
        weather_entity: weather.nws_khpn
        fallback_weather_entity: weather.forecast_home
        inside_entity: sensor.stairs_lower_presence_sensor_temperature
        outdoor_hours: [7, 22]
        cold: 45
        hot: 85
        # Notification bar along the bottom edge, with the same notices as the
        # living room e-ink panel's banner (keep these in step with
        # eink-panel-dashboard.yaml): the banner message (default template,
        # input_text.eink_banner), Humira days, a running dishwasher and open
        # perimeter doors. Hidden while empty; it never wakes the tablet.
        banner: true
        calendar_alerts:
          - entity: calendar.charisrebecca_gmail_com
            match: "^Humira$"
            icon: needle
        appliances:
          - name: Dishwasher
            icon: dishwasher
            state_entity: sensor.dishwasher_operation_state
            progress_entity: sensor.dishwasher_program_progress
        doors_entity: binary_sensor.perimeter_doors
        controls_columns: 3
        cards:
          - type: tile
            entity: light.kitchen_overhead_lights
            name: Kitchen
            features_position: bottom
            features:
              - type: light-brightness
          - type: tile
            entity: light.kitchen_counter_lights
            name: Counter
            features_position: bottom
            features:
              - type: light-brightness
          # Dining room ceiling fixture (light and fan together, one switch).
          - type: tile
            entity: light.dining_room_light_fan
            name: Dining light + fan
            icon: mdi:ceiling-fan-light
          # Relay L2 of the "Dining Room Relay".
          - type: tile
            entity: fan.kitchen_fan
            name: Kitchen fan
          # Dishwasher: its state, or the finish time while a program runs.
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.dishwasher_operation_state
                state_not: run
            card:
              type: tile
              entity: sensor.dishwasher_operation_state
              name: Dishwasher
              icon: mdi:dishwasher
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.dishwasher_operation_state
                state: run
            card:
              type: tile
              entity: sensor.dishwasher_program_finish_time
              name: Dishwasher done
              icon: mdi:dishwasher
          # Front doorbell: opens the camera's live view.
          - type: tile
            entity: camera.front_door_fluent
            name: Doorbell
            icon: mdi:doorbell-video
            hide_state: true
            color: blue
            tap_action:
              action: more-info
            icon_tap_action:
              action: more-info
