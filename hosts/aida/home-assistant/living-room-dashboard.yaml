# Dashboard for the living-room Fire HD 8 (Kiosk Satellite, logged in as the
# non-admin `kiosk` user; 1280x800 landscape, which the WebView lays out at
# 960x600 CSS px). HA dashboards are UI-managed (.storage), so this is the
# reference copy: the dashboard's URL is `dashboard-living-room` (not
# admin-only), and this is its raw configuration. The tablet's default
# dashboard (select.fire_8_default_dashboard) is dashboard-living-room/home.
#
# One sections view, three columns that fit the screen without scrolling:
# living room (lights, climate) | foyer (adjacent, with the front door) |
# doors and house; the Kiosk theme (frontend.themes in
# home-automation.nix) narrows the columns so three fit. Built-in cards only
# (the 2018 Fire has 1.5 GB of RAM). Tiles with a slider are two grid rows
# tall for an easy touch target.
title: Living Room
views:
  - title: Living Room
    path: home
    type: sections
    max_columns: 3
    theme: Kiosk
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Living room
            icon: mdi:sofa
          - type: tile
            entity: light.living_room_lights
            name: All living room
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: full
          - type: tile
            entity: light.living_room_overhead_lights
            name: Overhead
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: full
          - type: tile
            entity: light.living_room_floor_lamp
            name: Floor lamp
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: full
          # Climate: outside (NWS; icon follows the conditions), the
          # downstairs (stairs) and upstairs (bedroom) sensors, and humidity.
          - type: tile
            entity: weather.nws_khpn
            name: Outside
            state_content: temperature
          - type: tile
            entity: sensor.stairs_lower_presence_sensor_temperature
            name: Downstairs
            icon: mdi:home-thermometer-outline
          - type: tile
            entity: sensor.bedroom_climate_sensor_temperature
            name: Upstairs
            icon: mdi:bed-outline
          - type: tile
            entity: sensor.stairs_lower_presence_sensor_humidity
            name: Humidity
            icon: mdi:water-percent
      - type: grid
        cards:
          - type: heading
            heading: Foyer
            icon: mdi:door-open
          # Reolink doorbell, low-res "fluent" stream as periodically refreshed
          # snapshots (a constant live stream is heavy for the Fire); tap for
          # the live view.
          - type: picture-entity
            entity: camera.front_door_fluent
            name: Front door
            show_state: false
            camera_view: auto
            aspect_ratio: "4:3"
            grid_options:
              columns: full
          - type: tile
            entity: light.foyer_light
            name: Foyer
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: full
          - type: tile
            entity: light.front_porch_light
            name: Porch
            features_position: bottom
            features:
              - type: light-brightness
            grid_options:
              columns: full
      - type: grid
        cards:
          # The perimeter_doors group's members (home-automation.nix).
          - type: heading
            heading: Doors
            icon: mdi:door
          - type: tile
            entity: binary_sensor.front_door_contact
            name: Front
          - type: tile
            entity: binary_sensor.dining_room_sliding_door_contact
            name: Back
          - type: tile
            entity: binary_sensor.side_door_contact
            name: Side
          - type: tile
            entity: binary_sensor.utility_room_door_contact
            name: Utility
          - type: tile
            entity: binary_sensor.basement_door_contact
            name: Basement
          - type: tile
            entity: binary_sensor.attic_door_contact
            name: Attic
          - type: tile
            entity: binary_sensor.west_gate_contact
            name: West gate
            icon: mdi:gate
          - type: tile
            entity: binary_sensor.east_gate_contact
            name: East gate
            icon: mdi:gate
          - type: heading
            heading: House
            icon: mdi:home
          - type: tile
            entity: sensor.dishwasher_operation_state
            name: Dishwasher
            icon: mdi:dishwasher
          - type: tile
            entity: sensor.washer_dryer_current_status
            name: Laundry
            icon: mdi:washing-machine
          # Progress, only while a program is running.
          - type: conditional
            conditions:
              - condition: state
                entity: sensor.dishwasher_operation_state
                state: run
            card:
              type: tile
              entity: sensor.dishwasher_program_progress
              name: Dishwasher progress
              icon: mdi:progress-clock
            grid_options:
              columns: full
          - type: tile
            entity: script.turn_off_first_floor_lights
            name: Floor 1 off
            hide_state: true
            icon: mdi:home-floor-1
            color: amber
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.turn_off_first_floor_lights
          - type: tile
            entity: script.turn_off_all_lights
            name: All lights off
            hide_state: true
            icon: mdi:lightbulb-group-off
            color: amber
            tap_action:
              action: perform-action
              perform_action: script.turn_on
              target:
                entity_id: script.turn_off_all_lights
              confirmation:
                text: Turn off every light in the house?
