# Dashboard for the e1001-clock e-paper panel. HA dashboards are UI-managed
# (.storage), so this is the reference copy: create a dashboard with URL
# `eink-panel` (HA requires a hyphen), hide it from the sidebar, make sure the
# non-admin `eink` user can see it, then paste this into its raw configuration
# editor. Puppet renders /eink-panel/clock and the panel downloads it from
# https://eink.home.malloc47.com/eink-panel/clock (see e1001-clock.yaml).
title: E-ink panel
views:
  - title: Clock
    path: clock
    panel: true
    cards:
      - type: custom:eink-dashboard-card
        # 4-gray panel: gray secondary text and rules. No "Updated" stamp, so
        # an unchanged dashboard renders identically (Puppet's ETag then lets
        # the panel skip a flashing full refresh).
        gray: true
        show_updated: false
        # NWS (official forecast, with precipitation probabilities); met.no takes
        # over while it's unavailable.
        weather_entity: weather.nws_khpn
        fallback_weather_entity: weather.forecast_home
        inside_entity: sensor.bedroom_climate_sensor_temperature
        sun_entity: sun.sun
        # The panel draws its own battery level into this blank footer spot.
        battery_slot: true
        days: 5
        # Open members of this binary sensor group (perimeter doors, defined in
        # home-automation.nix) are listed in the banner with a door icon.
        doors_entity: binary_sensor.perimeter_doors
        # Shown in the banner (icon + progress) only while running/paused.
        # Banner item for the whole day of a matching calendar event (also
        # stacked with the message, appliances and doors): Charis's Humira
        # injection day, an all-day event every 10 days. "^...$" so the
        # separate "Order Humira" reminder doesn't match.
        calendar_alerts:
          - entity: calendar.charisrebecca_gmail_com
            match: "^Humira$"
            icon: needle
        appliances:
          - name: Dishwasher
            icon: dishwasher
            state_entity: sensor.dishwasher_operation_state
            progress_entity: sensor.dishwasher_program_progress
        # Omit banner_template to use the card's default message,
        # input_text.eink_banner. Any Jinja works here; an empty result shows
        # just the doors (or hides the banner if none are open).
  # Page 1 (left/right buttons): big clock, condensed "now" row, today/tomorrow
  # outlook (rain timing, temperature range and what to wear for outdoor hours)
  # and the 5-day forecast.
  - title: Focus
    path: focus
    panel: true
    cards:
      - type: custom:eink-dashboard-card
        # 4-gray panel: gray secondary text and rules. No "Updated" stamp, so
        # an unchanged dashboard renders identically (Puppet's ETag then lets
        # the panel skip a flashing full refresh).
        gray: true
        show_updated: false
        layout: focus
        # NWS (official forecast, with precipitation probabilities); met.no takes
        # over while it's unavailable.
        weather_entity: weather.nws_khpn
        fallback_weather_entity: weather.forecast_home
        inside_entity: sensor.bedroom_climate_sensor_temperature
        sun_entity: sun.sun
        battery_slot: true
        doors_entity: binary_sensor.perimeter_doors
        # Shown in the banner (icon + progress) only while running/paused.
        calendar_alerts:
          - entity: calendar.charisrebecca_gmail_com
            match: "^Humira$"
            icon: needle
        appliances:
          - name: Dishwasher
            icon: dishwasher
            state_entity: sensor.dishwasher_operation_state
            progress_entity: sensor.dishwasher_program_progress
        # NWS forecasts 6 days past today (met.no, the fallback, only 5).
        days: 6
        # Hours you're likely to be outside (local), and the °F thresholds for
        # the clothing hint.
        outdoor_hours: [7, 22]
        cold: 45
        hot: 85
  # Page 2: the focus information sized for reading at 6-9 ft (frame-mounted
  # panels): bigger date and current temperatures beside the clock, and big
  # Today/Tomorrow rows instead of the multi-day forecast.
  - title: Far
    path: far
    panel: true
    cards:
      - type: custom:eink-dashboard-card
        # 4-gray panel: gray secondary text and rules. No "Updated" stamp, so
        # an unchanged dashboard renders identically (Puppet's ETag then lets
        # the panel skip a flashing full refresh).
        gray: true
        show_updated: false
        layout: far
        weather_entity: weather.nws_khpn
        fallback_weather_entity: weather.forecast_home
        inside_entity: sensor.bedroom_climate_sensor_temperature
        sun_entity: sun.sun
        battery_slot: true
        doors_entity: binary_sensor.perimeter_doors
        calendar_alerts:
          - entity: calendar.charisrebecca_gmail_com
            match: "^Humira$"
            icon: needle
        appliances:
          - name: Dishwasher
            icon: dishwasher
            state_entity: sensor.dishwasher_operation_state
            progress_entity: sensor.dishwasher_program_progress
        outdoor_hours: [7, 22]
        cold: 45
        hot: 85
