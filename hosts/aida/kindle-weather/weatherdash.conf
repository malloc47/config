# Settings for weatherdash.sh, sourced by it on start (docs/kindle-weather.md).
# Edit here and run ./deploy.sh; the Kindle reads it at the next launch.

# The dashboard image: Puppet's render of the kindle-weather dashboard
# (hosts/aida/home-assistant/kindle-weather-dashboard.yaml) at the panel's
# native 1072x1448, reduced to its 16 grays, as a single-channel PNG
# (&grayscale; eips draws RGBA garbled). weatherdash.sh appends
# &next=<seconds until the following wake> so Puppet preloads the page.
URL="https://eink.home.malloc47.com/kindle-weather/weather?viewport=1072x1448&colors=000000,111111,222222,333333,444444,555555,666666,777777,888888,999999,AAAAAA,BBBBBB,CCCCCC,DDDDDD,EEEEEE,FFFFFF&format=png&grayscale&wait=2000"

# Battery report, POSTed as {"battery": N, "charging": 0|1} after each fetch
# (sensor.kindle_weather_battery in nixos/modules/home-automation.nix).
# Empty disables it.
BATTERY_WEBHOOK="https://home.malloc47.com/api/webhook/kindle-weather-battery"

# Wake every INTERVAL seconds, OFFSET seconds past the boundary (e.g. hourly
# at :02, after HA's weather integrations have polled).
INTERVAL=3600
OFFSET=120

# No wakes from QUIET_START to QUIET_END (local hours, may wrap midnight); the
# first wake after it refreshes. Set both equal to wake around the clock.
QUIET_START=23
QUIET_END=5

# Local time for the quiet hours and the stale notice (the Kindle's own zone
# setting isn't reliable with the framework stopped).
TZ="EST5EDT,M3.2.0,M11.1.0"

# After this many seconds without a successful fetch, print a one-line
# "Not updated since ..." at the bottom of the screen, so stale weather isn't
# mistaken for current. 0 disables it.
STALE_AFTER=7200

# Power button: one press refreshes now; a second press within this many
# seconds exits to the Kindle UI instead.
DOUBLE_PRESS=3

# Seconds to wait for Wi-Fi to reassociate after a wake.
WIFI_TIMEOUT=45

# RTC whose alarm wakes the device (rtc0 and rtc1, both the PMIC's, work on
# the PW3; rtc0 is the system clock's).
RTC_DEV=rtc1
