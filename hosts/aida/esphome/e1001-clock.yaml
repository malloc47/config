# Seeed reTerminal E1001 (ESP32-S3, 7.5" e-paper) as a wall clock + dashboard.
#
# The screen is a hybrid: the background is a PNG of an HA dashboard view
# (eink-dashboard-card, rendered by Puppet on aida and fetched from
# eink.home.malloc47.com), and the firmware draws the time and date into the
# card's blank clock area itself, so the clock keeps its per-minute partial
# refresh. Two pages, switched with the left/right buttons; both backgrounds
# are prefetched, so switching needs no network:
#   0  /eink-panel/clock  dashboard, clock in x 214-586, y 10-176
#   1  /eink-panel/focus  big clock across y 8-206, today/tomorrow outlook
substitutions:
  name: e1001-clock
  friendly_name: e1001-clock
  api_key: !secret e1001_clock_api_key
  ota_password: !secret e1001_clock_ota_password
  ap_password: !secret e1001_clock_ap_password

packages:
  base: !include common/base.yaml

esphome:
  on_boot:
    priority: 600
    then:
      # Populate system time from the E1001's onboard RTC immediately.
      - pcf8563.read_time:
      # Power the battery voltage divider so the ADC can read it.
      - output.turn_on: bsp_battery_enable

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

# 8 MB octal PSRAM (per Seeed's E1001 ESPHome guide); holds the background image.
psram:
  mode: octal
  speed: 80MHz

# Enable logging (on top of common/base.yaml)
logger:
  hardware_uart: UART0

# E1001 onboard RTC bus
i2c:
  scl: GPIO20
  sda: GPIO19

# E1001 e-paper SPI bus
spi:
  clk_pin: GPIO7
  mosi_pin: GPIO9

time:
  - platform: pcf8563
    id: rtc_time
    address: 0x51
    timezone: "America/New_York"
    update_interval: never

    on_time:
      - seconds: 0
        minutes: "*"
        then:
          - if:
              condition:
                lambda: |-
                  return id(rtc_time).now().minute == 0;
              then:
                - epaper_spi.full_update_next: epaper_display
          - component.update: epaper_display

  - platform: homeassistant
    id: ha_time
    timezone: "America/New_York"

    on_time_sync:
      then:
        - pcf8563.write_time:

# Battery: ADC on GPIO1 behind a 2:1 divider enabled by GPIO21. The E1001 has
# no charge-status pin, so "external power" is inferred from the cell sitting
# at its charge voltage; the dashboard hides the battery level while it's on.
output:
  - platform: gpio
    pin: GPIO21
    id: bsp_battery_enable

sensor:
  - platform: adc
    pin: GPIO1
    id: battery_voltage
    name: "Battery Voltage"
    attenuation: 12db
    update_interval: 60s
    filters:
      - multiply: 2.0
    entity_category: diagnostic

  - platform: copy
    source_id: battery_voltage
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    filters:
      - calibrate_linear:
          - 4.15 -> 100.0
          - 3.27 -> 0.0
      - clamp:
          min_value: 0
          max_value: 100

binary_sensor:
  # Top-edge buttons: left = previous page, right = next page (GPIO5/GPIO4,
  # active low; per Seeed's E1001 ESPHome guide).
  - platform: gpio
    id: button_left
    pin:
      number: GPIO5
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - script.execute:
          id: show_page
          p: !lambda "return (id(page) + 2 - 1) % 2;"
  - platform: gpio
    id: button_right
    pin:
      number: GPIO4
      mode: INPUT_PULLUP
      inverted: true
    on_press:
      - script.execute:
          id: show_page
          p: !lambda "return (id(page) + 1) % 2;"

  - platform: template
    name: "External Power"
    device_class: power
    lambda: |-
      return id(battery_voltage).state > 4.12;
    filters:
      - delayed_off: 5min

http_request:
  timeout: 20s
  watchdog_timeout: 25s

# Which page is on screen (see the header). Not restored across reboots.
globals:
  - id: page
    type: int
    initial_value: "0"

script:
  # Show a page: full refresh, since the layouts differ too much for a
  # partial update to come out clean.
  - id: show_page
    parameters:
      p: int
    then:
      - lambda: "id(page) = p;"
      - epaper_spi.full_update_next: epaper_display
      - component.update: epaper_display
  # Re-fetch every page's background (HA pushes, the HA button, Wi-Fi up).
  - id: refresh_backgrounds
    then:
      - component.update: dashboard_image
      - component.update: focus_image

online_image:
  - id: dashboard_image
    url: "https://eink.home.malloc47.com/eink-panel/clock?viewport=800x480&colors=000000,FFFFFF&format=png&wait=1500"
    format: PNG
    type: BINARY
    update_interval: 15min
    on_download_finished:
      - if:
          condition:
            lambda: "return id(page) == 0;"
          then:
            - component.update: epaper_display
    # The first scheduled fetch runs at boot, before Wi-Fi is up; without a
    # retry the panel would show only the clock until the next interval.
    on_error:
      - delay: 30s
      - component.update: dashboard_image
  - id: focus_image
    url: "https://eink.home.malloc47.com/eink-panel/focus?viewport=800x480&colors=000000,FFFFFF&format=png&wait=1500"
    format: PNG
    type: BINARY
    update_interval: 15min
    on_download_finished:
      - if:
          condition:
            lambda: "return id(page) == 1;"
          then:
            - component.update: epaper_display
    on_error:
      - delay: 30s
      - component.update: focus_image

# Fetch the backgrounds as soon as the network is up (boot and reconnects).
# Merges with the wifi: block from common/base.yaml.
wifi:
  on_connect:
    - script.execute: refresh_backgrounds

# Let HA push refreshes instead of waiting for the 15-minute poll: the
# "E-ink panel: push dashboard refresh" automation (home-automation.nix) calls
# esphome.e1001_clock_refresh_dashboard when the banner, perimeter doors or
# weather change; the button is the manual equivalent in HA's UI. A refresh
# re-fetches the Puppet renders, and the visible page redraws when its image lands.
# Merges with the api: block from common/base.yaml.
api:
  actions:
    - action: refresh_dashboard
      variables:
        full: bool
      then:
        - if:
            condition:
              lambda: "return full;"
            then:
              - epaper_spi.full_update_next: epaper_display
        - script.execute: refresh_backgrounds

button:
  - platform: template
    name: "Refresh Dashboard"
    icon: mdi:refresh
    on_press:
      - script.execute: refresh_backgrounds

font:
  - file: "gfonts://Inter@700"
    id: clock_font
    size: 120

  - file: "gfonts://Inter@600"
    id: date_font
    size: 26

  # Page 1's big clock: digits and colon only, to keep flash use down.
  - file: "gfonts://Inter@700"
    id: big_clock_font
    size: 200
    glyphs: "0123456789:"

  - file: "gfonts://Inter@600"
    id: big_date_font
    size: 30

display:
  - platform: epaper_spi
    id: epaper_display
    model: Seeed-reTerminal-E1001

    update_interval: never

    # Keep partial-refresh mode enabled, but make the automatic
    # fallback much longer than our hourly forced refresh.
    full_update_every: 255

    lambda: |-
      it.fill(Color::WHITE);

      // Background: the page's Puppet render (white pixels are "on"). Empty
      // until its first download finishes, leaving just the clock.
      it.image(0, 0, id(page) == 1 ? id(focus_image) : id(dashboard_image),
               Color::WHITE, Color::BLACK);

      auto now = id(rtc_time).now();
      if (now.is_valid()) {
        int h = now.hour % 12;
        if (h == 0) h = 12;
        if (id(page) == 1) {
          // Big clock area: x 16-784, y 8-206 (left blank by the focus card).
          it.printf(400, 164, id(big_clock_font), Color::BLACK, TextAlign::BASELINE_CENTER,
                    "%d:%02d", h, now.minute);
          it.printf(400, 202, id(big_date_font), Color::BLACK, TextAlign::BASELINE_CENTER,
                    "%s %d", now.strftime("%A, %B").c_str(), now.day_of_month);
        } else {
          // Clock area: x 214-586, y 10-176 (left blank by the card).
          it.printf(400, 116, id(clock_font), Color::BLACK, TextAlign::BASELINE_CENTER,
                    "%d:%02d", h, now.minute);
          it.printf(400, 160, id(date_font), Color::BLACK, TextAlign::BASELINE_CENTER,
                    "%s %d", now.strftime("%A, %B").c_str(), now.day_of_month);
        }
      }
